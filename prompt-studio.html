<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #F8F7F4;
      --surface:       #FFFFFF;
      --border:        rgba(0,0,0,0.08);
      --border-mid:    rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.18);
      --ink:           #18181B;
      --ink-dim:       #52525B;
      --ink-faint:     #A1A1AA;
      --accent:        #0EA5E9;
      --accent-dim:    #0284C7;
      --accent-bg:     #F0F9FF;
      --accent-border: #BAE6FD;
      --radius-sm:     8px;
      --radius:        12px;
      --radius-lg:     18px;
      --sans:          'Geist', -apple-system, sans-serif;
      --serif:         'Instrument Serif', Georgia, serif;
      --mono:          'Geist Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ─────────────────────────────────── */

    .page-header {
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .wordmark em { color: var(--accent); font-style: normal; }

    .progress-bar {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 24px 0;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .prog-step {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .prog-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--ink-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-faint);
      font-family: var(--sans);
      transition: all 0.2s;
    }

    .prog-step.is-done .prog-dot {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .prog-step.is-active .prog-dot {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    .prog-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-faint);
    }

    .prog-step.is-done .prog-label { color: var(--accent); }
    .prog-step.is-active .prog-label { color: var(--ink); }

    .prog-line {
      flex: 1;
      height: 1px;
      background: var(--border);
      margin: 0 10px;
    }

    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 24px 96px;
    }

    /* ── Step header ─────────────────────────────── */

    .step-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 10px;
    }

    .step-title {
      font-family: var(--serif);
      font-size: 34px;
      letter-spacing: -0.025em;
      line-height: 1.1;
      color: var(--ink);
    }

    .step-sub {
      margin-top: 8px;
      font-size: 15px;
      color: var(--ink-dim);
      max-width: 520px;
    }

    .step-header { margin-bottom: 36px; }

    /* ── Summary bar ──────────────────────────────── */

    .summary-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 32px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .summary-item { color: var(--ink-dim); }
    .summary-item b { color: var(--ink); font-weight: 600; }

    .summary-sep {
      width: 1px;
      height: 14px;
      background: var(--border-mid);
    }

    /* ── Role grid ────────────────────────────────── */

    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
    }

    .role-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      cursor: pointer;
      transition: border-color 0.14s, transform 0.14s, box-shadow 0.14s;
      position: relative;
      text-align: left;
      user-select: none;
    }

    .role-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .role-card.is-selected {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .role-card.is-disabled {
      pointer-events: none;
      opacity: 0.38;
      cursor: default;
    }

    .role-card.is-disabled .rc-soon {
      display: inline-block;
    }

    .rc-soon {
      display: none;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-top: 6px;
    }

    .role-card .rc-icon {
      width: 30px;
      height: 30px;
      margin-bottom: 12px;
      color: var(--ink-dim);
    }

    .role-card.is-selected .rc-icon { color: var(--accent); }

    .role-card .rc-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 3px;
    }

    .role-card .rc-desc {
      font-size: 12px;
      color: var(--ink-dim);
      line-height: 1.45;
    }

    .rc-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: none;
      gap: 4px;
    }

    .role-card:hover .rc-actions { display: flex; }

    .rc-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: rgba(0,0,0,0.07);
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-dim);
      transition: all 0.1s;
      padding: 0;
    }

    .rc-btn:hover { background: rgba(0,0,0,0.13); color: var(--ink); }

    .add-role-card {
      border: 1.5px dashed var(--border-mid);
      border-radius: var(--radius);
      padding: 20px 18px;
      cursor: pointer;
      transition: all 0.14s;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }

    .add-role-card:hover {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .add-role-card .arc-icon {
      width: 24px;
      height: 24px;
      color: var(--ink-faint);
      margin-bottom: 4px;
    }

    .add-role-card .arc-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-dim);
    }

    /* ── Content grid ─────────────────────────────── */

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
    }

    .content-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 16px 20px;
      cursor: pointer;
      transition: border-color 0.14s, transform 0.14s, box-shadow 0.14s;
      text-align: center;
      user-select: none;
      position: relative;
    }

    .cc-info {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      border-radius: 999px;
      color: var(--ink-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      opacity: 0.55;
      transition: opacity 0.12s, background 0.12s, color 0.12s;
    }
    .cc-info:hover { opacity: 1; background: var(--border); color: var(--ink); }
    .content-card.is-selected .cc-info { color: var(--accent); opacity: 0.8; }

    .content-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .content-card.is-selected {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .content-card .cc-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 12px;
      color: var(--ink-dim);
    }

    .content-card.is-selected .cc-icon { color: var(--accent); }

    .content-card .cc-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    /* ── Form ─────────────────────────────────────── */

    .form-stack { display: flex; flex-direction: column; gap: 24px; }

    .form-section-title {
      font-family: var(--serif);
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin: 12px 0 -8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .form-stack > .form-section-title:first-child { margin-top: 0; }

    .advanced-section { display: flex; flex-direction: column; gap: 24px; }
    .advanced-toggle {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
      padding: 12px 0;
      background: transparent; border: none; border-bottom: 1px solid var(--border);
      font-family: var(--serif); font-size: 18px; letter-spacing: -0.01em;
      color: var(--ink); cursor: pointer; text-align: left;
    }
    .advanced-toggle:hover { color: var(--accent); }
    .advanced-chev {
      display: inline-flex; transition: transform 0.18s ease;
      color: var(--ink-dim);
    }
    .advanced-toggle.is-open .advanced-chev { transform: rotate(90deg); }
    .advanced-panel { display: flex; flex-direction: column; gap: 24px; }
    .advanced-panel[hidden] { display: none; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .req { color: var(--accent); }

    .opt-tag {
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-faint);
    }

    .field-hint {
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: -4px;
    }

    .fi {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border-mid);
      border-radius: var(--radius-sm);
      font-family: var(--sans);
      font-size: 14px;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
    }

    .fi:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }

    .fi::placeholder { color: var(--ink-faint); }

    textarea.fi {
      resize: vertical;
      min-height: 88px;
      line-height: 1.55;
    }

    select.fi {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2371717A' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 38px;
    }

    /* Chips */

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      padding: 6px 13px;
      border: 1.5px solid var(--border-mid);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      background: var(--surface);
      color: var(--ink-dim);
      user-select: none;
    }

    .chip:hover {
      border-color: var(--border-strong);
      color: var(--ink);
    }

    .chip.is-selected {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ── Grouped chips ──────────────────────────────── */
    .chips-grouped-wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1.5px solid var(--border-mid);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .chips-group {
      padding: 12px 14px;
    }

    .chips-group + .chips-group {
      border-top: 1px solid var(--border);
    }

    .chips-group-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 9px;
    }

    .chips-more-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 9px;
      padding: 6px 12px;
      background: none;
      border: 1px solid var(--border-mid);
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .chips-more-toggle:hover {
      border-color: var(--ink-faint);
      color: var(--ink);
    }

    .chips-more-caret {
      font-size: 10px;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .chips-more-toggle.is-open .chips-more-caret {
      transform: rotate(180deg);
    }

    .chips-more-panel {
      margin-top: 9px;
    }

    .chips-more-panel[hidden] {
      display: none;
    }

    /* Toggle */

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }

    .toggle-track {
      width: 40px;
      height: 22px;
      background: var(--border-strong);
      border-radius: 11px;
      position: relative;
      transition: background 0.18s;
      flex-shrink: 0;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.18s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }

    .toggle-track.is-on { background: var(--accent); }
    .toggle-track.is-on::after { transform: translateX(18px); }

    .toggle-label-text { font-size: 14px; color: var(--ink); }

    /* ── Range slider ───────────────────────────── */
    .range-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .range-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--border-mid) var(--fill, 50%));
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2.5px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.18);
    }

    .range-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2.5px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.18);
    }

    .range-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .range-end {
      font-size: 11.5px;
      color: var(--ink-faint);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .range-current {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      text-align: center;
      flex: 1;
    }

    /* ── Color picker ────────────────────────────── */

    .cp-grid { display: flex; flex-direction: column; gap: 6px; }

    .cp-row { display: flex; align-items: center; gap: 10px; }

    .cp-swatch-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 9px;
      overflow: hidden;
      border: 1.5px solid var(--border-mid);
      cursor: pointer;
    }
    .cp-swatch-wrap input[type="color"] {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      opacity: 0;
      cursor: pointer;
    }
    .cp-swatch {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cp-hex {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-dim);
      min-width: 68px;
      letter-spacing: 0.04em;
    }

    .cp-label {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 13px;
      font-family: var(--sans);
      background: var(--surface);
      color: var(--ink);
      outline: none;
      min-width: 0;
    }
    .cp-label:focus { border-color: var(--accent); }

    .cp-remove {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.14s, background 0.14s;
    }
    .cp-remove:hover { color: #ef4444; background: #fef2f2; }

    .cp-placeholder { width: 28px; flex-shrink: 0; }

    .cp-empty {
      font-size: 12.5px;
      color: var(--ink-faint);
      font-style: italic;
      padding: 2px 0 4px;
    }

    .cp-add {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--sans);
      padding: 0;
    }
    .cp-add:hover { opacity: 0.75; }

    /* ── Color strategy (3-mode) ─────────────────── */
    .cs-tabs { display: flex; margin: 2px 0 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .cs-tab { flex: 1; padding: 7px 10px; font-size: 12.5px; font-weight: 500; font-family: var(--sans); border: none; border-right: 1.5px solid var(--border); background: transparent; color: var(--ink-dim); cursor: pointer; transition: background 0.14s, color 0.14s; text-align: center; }
    .cs-tab:last-child { border-right: none; }
    .cs-tab.is-active { background: var(--accent); color: #fff; }
    .cs-tab:hover:not(.is-active) { background: var(--surface); color: var(--ink); }
    .cs-ai-note { font-size: 12.5px; color: var(--ink-faint); font-style: italic; padding: 2px 0 4px; }
    .cs-upload-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; color: var(--accent); cursor: pointer; font-family: var(--sans); padding: 4px 0; background: none; border: none; }
    .cs-upload-btn:hover { opacity: 0.75; }
    .cs-palette-preview { display: flex; align-items: center; gap: 12px; }
    .cs-palette-thumb { max-width: 110px; max-height: 60px; border-radius: 7px; border: 1.5px solid var(--border); object-fit: cover; }
    .cs-palette-name { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }

    /* ── Reference picker ────────────────────────── */

    .ref-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }

    .ref-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
    }

    .ref-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--ink-faint);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ref-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      font-family: var(--sans);
      background: transparent;
      color: var(--ink);
      min-width: 0;
    }
    .ref-input::placeholder { color: var(--ink-faint); }

    .ref-thumb {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 5px;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .ref-filename {
      flex: 1;
      font-size: 12px;
      color: var(--ink-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .ref-remove {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.14s, background 0.14s;
    }
    .ref-remove:hover { color: #ef4444; background: #fef2f2; }

    .ref-add-row { display: flex; gap: 14px; flex-wrap: wrap; }

    .ref-add-btn {

      font-size: 22px;

      right: 18px;

      justify-content: flex-end;

    .info-lede { font-size: 13px; line-height: 1.55; color: var(--ink); margin: 0 0 14px; }

      font-family: var(--sans);

    .info-sub { margin-top: 14px; }
    .info-sub:first-child { margin-top: 0; }

      font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-dim); margin: 0 0 6px;

    .info-sub p { font-size: 13px; line-height: 1.55; color: var(--ink); margin: 0; }
    .info-sub ul { margin: 0; padding-left: 18px; }
    .info-sub li { font-size: 13px; line-height: 1.6; color: var(--ink); }
    .info-empty { font-size: 13px; line-height: 1.55; color: var(--ink-dim); font-style: italic; margin: 0; }

    /* ── Animations ───────────────────────────────── */

    .step-in {
      animation: stepIn 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .step-out {
      animation: stepOut 0.22s cubic-bezier(0.4, 0, 1, 1) both;
      pointer-events: none;
    }

    @keyframes stepIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes stepOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-10px); }
    }

    .role-card.is-confirmed,
    .content-card.is-confirmed {
      animation: cardConfirm 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes cardConfirm {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    /* ── Responsive ───────────────────────────────── */

    @media (max-width: 580px) {
      .role-grid  { grid-template-columns: 1fr 1fr; }
      .content-grid { grid-template-columns: repeat(3, 1fr); }
      .step-title { font-size: 28px; }
      .main { padding: 36px 16px 80px; }
      .content-card { padding: 18px 10px 16px; }
    }

    /* icon helper */
    .ico {
      display: inline-flex;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .ico svg { display: block; }
  </style>

function buildPrompt() {
  const roles = getRoles();
  const role    = roles.find(r => r.id === S.role);
  const content = CONTENT_TYPES.find(c => c.id === S.content);
  if (!role || !content) return '';

  const lines = [];
  const pushColorList = (label, colors) => {
    if (!colors.length) return;
    lines.push(`${label}:`);
    colors.forEach(c => lines.push(`  ${c.label}: ${c.hex}`));
  };

  if (content.slimPrompt) {
    lines.push(content.slimPrompt);
  } else {
    lines.push(`You are an expert ${role.name} — ${role.desc}.`);
    if (role.keywords) lines.push(`Core expertise: ${role.keywords}.`);
    if (content.taskExpertise) lines.push(`For this task — ${content.taskExpertise}.`);
    const optimizeFor = [...(role.optimizeFor || []), ...(content.optimizeFor || [])];
    if (optimizeFor.length) {
      lines.push('');
      lines.push('Optimize for:');
      optimizeFor.forEach(o => lines.push(`  - ${o}`));
    }
    const guidance = [...(role.guidance || []), ...(content.guidance || [])];
    if (guidance.length) {
      lines.push('');
      lines.push('When responding:');
      guidance.forEach(g => lines.push(`  - ${g}`));
    }
    lines.push('');
    lines.push(`Task: Create a ${content.label}`);
  }
  lines.push('');
  lines.push('─── PROJECT BRIEF ───────────────────────────────');
  lines.push('');

  content.fields.forEach(f => {
    if (f.type === 'section') return;
    if (f.promptHidden) return;
    if (f.showIf && !isCondMet(f.showIf)) return;
    const lbl = f.promptLabel || f.label;
    if (f.type === 'refpicker') {
      const refs = (S.refs[f.id] || []).filter(r =>
        r.type === 'url' ? r.value.trim() : r.name
      );
      if (refs.length) {
        const listRefs = () => refs.forEach((r, i) => {
          if (r.type === 'url') lines.push(`  ${i + 1}. ${r.value.trim()}`);
          else lines.push(`  ${i + 1}. ${r.name} (attach this image to your conversation)`);
        });
        if (f.assetKind === 'logo') {
          lines.push(`${lbl} — this logo MUST appear in the final design, reproduced exactly as provided:`);
          listRefs();
          lines.push('  Place the logo into the composition without redrawing, recolouring, cropping, or distorting it. Preserve its exact shape, colours, and proportions, and give it adequate clear space.');
        } else if (f.assetMode) {
          lines.push(`${lbl} — these images MUST be incorporated into the final design (they are not style references):`);
          listRefs();
          lines.push('  Composite these images cleanly and legibly into the layout. Integrate them naturally into the design rather than using them only as inspiration.');
        } else {
          lines.push(`${lbl}:`);
          listRefs();
        }
      }
    } else if (f.type === 'colorpicker') {
      pushColorList(lbl, S.colors[f.id] || []);
    } else if (f.type === 'colorstrategy') {
      const mode = S.form[f.id + '_mode'] || f.defaultColorMode || 'ai';
      if (mode === 'manual') {
        pushColorList(lbl, S.colors[f.id] || []);
      } else if (mode === 'upload') {
        const pal = S.refs[f.id + '_palette'];
        lines.push(`${lbl} — MANDATORY COLOUR MATCHING:`);
        lines.push(`  The attached reference image${pal ? ` ("${pal.name}")` : ''} defines the colour palette for this design.`);
        lines.push(`  Extract the dominant, secondary, and accent colours from that image and apply them as the exclusive palette throughout.`);
        lines.push(`  Every colour in this work — backgrounds, type, graphics, and any other element — must come directly from that reference.`);
        lines.push(`  Do not introduce any colour that does not appear in the reference image.`);
      } else if (mode === 'bw') {
        lines.push(`${lbl}: Start in black and white — solve the mark in one colour first. Colour can be introduced once the silhouette and form are working.`);
      } else {
        lines.push(`${lbl}: No specific colours defined — choose a palette that best fits this brief and tone.`);
      }
    } else if (f.type === 'toggle') {
      lines.push(`${lbl}: ${S.toggles[f.id] ? 'Yes' : 'No'}`);
    } else if (f.type === 'range') {
      const val = S.form[f.id] !== undefined ? S.form[f.id] : (f.default !== undefined ? f.default : 50);
      if (f.promptMap) {
        const keys = Object.keys(f.promptMap).map(Number).sort((a, b) => a - b);
        let text = f.promptMap[keys[0]];
        for (const k of keys) { if (val >= k) text = f.promptMap[k]; }
        lines.push(`${lbl}: ${text}`);
      } else {
        lines.push(`${lbl}: ${val}`);
      }
    } else if (f.type === 'chips' || f.type === 'chips-one' || f.type === 'chips-grouped') {
      const sel = S.chips[f.id] || [];
      if (!sel.length) return;
      if (f.multiPrompt) {
        const customField = content.fields.find(cf => cf.showIf && cf.showIf.field === f.id && cf.showIf.value === 'Custom');
        const customVal   = customField ? (S.form[customField.id] || '').trim() : '';
        const resolved    = sel.map(s => s === 'Custom' ? (customVal || 'Custom size (specify)') : s);
        if (resolved.length > 1) {
          lines.push(`Generate ${resolved.length} separate images in these sizes:`);
          lines.push('');
          resolved.forEach((s, i) => lines.push(`${i + 1}. Image ${i + 1} — ${s}`));
        } else {
          lines.push(`${lbl}: ${resolved[0]}`);
        }
      } else {
        if (sel.length === 1 && /let ai decide/i.test(sel[0])) {
          lines.push(`${lbl}: AI's choice — pick what best fits the brief, mood, and subject.`);
        } else {
          lines.push(`${lbl}: ${sel.join(', ')}`);
        }
      }
    } else {
      const val = (S.form[f.id] || '').trim();
      if (val) lines.push(`${lbl}: ${val}`);
    }
  });

  if (content.closing) {
    lines.push('');
    lines.push(content.closing);
  }

  const PHOTO_TYPES = ['photo', 'portrait', 'landscape', 'nature-wildlife', 'street', 'product-photo'];
  const SELF_DIRECTED = new Set(['logo', 'chardesign']);
  const deliverable = PHOTO_TYPES.includes(content.id) ? 'photograph' : content.label.toLowerCase();

  lines.push('');
  lines.push('─────────────────────────────────────────────────');
  lines.push('');
  lines.push('Constraints:');
  lines.push('Do not add unrelated text, random logos, watermarks, or unrelated objects.');
  lines.push('');
  lines.push(`Before producing the final ${deliverable}, ask me exactly 5 targeted questions to better understand my vision.`);
  lines.push('');
  lines.push('Question rules:');
  lines.push(`- Make each question specific to this ${content.label.toLowerCase()}, not generic.`);
  lines.push(`- Ask about details that would meaningfully sharpen the final ${deliverable}.`);
  lines.push('- Where useful, include short examples so the questions are easy to answer.');
  lines.push('- Do not ask more than 5 questions.');
  lines.push(`- Do not start producing the ${deliverable} yet.`);

  if (!SELF_DIRECTED.has(content.id)) {
    lines.push('');
    lines.push('After I answer the 5 questions:');
    lines.push(`- Immediately produce the final ${deliverable} based on the brief and my answers.`);
    lines.push('- Do not ask any further questions.');
    lines.push('- Do not restate the brief outside the final deliverable.');
    lines.push('- Do not explain your process.');
  }

  if (content.id === 'logo') {
    lines.push('');
    lines.push('Once I have answered your questions, generate 3 distinct logo concept directions based on this brief. For each concept, provide:');
    lines.push('');
    lines.push('Concept 1 — [Name / Direction]');
    lines.push('• Description: what it looks like and why it fits the brand');
    lines.push('• Visual elements: shapes, type treatment, mark style');
    lines.push('• Scalability note: how it works in one colour and at small sizes');
    lines.push('• Colour suggestion: primary + accent');
    lines.push('• Mood / feeling it conveys');
    lines.push('');
    lines.push('Concept 2 — [Name / Direction]');
    lines.push('• Description');
    lines.push('• Visual elements');
    lines.push('• Scalability note');
    lines.push('• Colour suggestion');
    lines.push('• Mood / feeling');
    lines.push('');
    lines.push('Concept 3 — [Name / Direction]');
    lines.push('• Description');
    lines.push('• Visual elements');
    lines.push('• Scalability note');
    lines.push('• Colour suggestion');
    lines.push('• Mood / feeling');
    lines.push('');
    lines.push('After presenting all 3 concepts, ask:');
    lines.push('"Would you like to redo all 3 with a different direction, or shall we pick one and develop it further into final artwork?"');
  }

  if (content.id === 'illustration' && S.toggles['charInclude']) {
    const styleApproach = (S.chips['charStyleApproach'] || [])[0];
    lines.push('');
    lines.push('─── STYLE CONSISTENCY ───────────────────────────');
    lines.push('');
    if (styleApproach === "Match character's style") {
      lines.push('Style direction: Use the character reference images as the visual style guide for the entire illustration. The background, environment, and all scene elements must be rendered in the same style as the character — not just in a similar genre, but the same visual language, line weight, rendering technique, and medium.');
    } else {
      lines.push('Style direction: You have creative freedom to choose the art style that best fits this brief. Base your style choice on the overall mood, composition, and subject — not necessarily on the character references.');
    }
    lines.push('');
    lines.push('Style uniformity (non-negotiable): Every element in the illustration — the character, background, objects, and scene — must share one consistent art style and medium. Do not mix styles or rendering techniques under any circumstances. For example: no vector character on a painted background, no digital character in a watercolour scene, no 3D figure against a flat graphic environment. The piece must read as one cohesive artwork.');
  }

  if (content.id === 'chardesign') {
    const selectedAngles      = S.chips['angles']      || [];
    const selectedExpressions = S.chips['expressions'] || [];

    lines.push('');
    lines.push('─── OUTPUT FORMAT ───────────────────────────────');
    lines.push('');
    lines.push('All character sheets must use a plain white background. This is a character design reference document — the background should never distract from the character itself.');
    lines.push('');

    if (selectedAngles.length > 0 || selectedExpressions.length > 0) {
      lines.push('Once you have answered my questions, generate the following as separate images:');
      lines.push('');

      if (selectedAngles.length > 0) {
        lines.push(`Character views (${selectedAngles.length} image${selectedAngles.length > 1 ? 's' : ''}):`);
        selectedAngles.forEach((a, i) => lines.push(`  ${i + 1}. Full-body character sheet — ${a} — plain white background`));
        lines.push('');
      }

      if (selectedExpressions.length > 0) {
        lines.push(`Facial expressions (${selectedExpressions.length} image${selectedExpressions.length > 1 ? 's' : ''}):`);
        selectedExpressions.forEach((e, i) => lines.push(`  ${i + 1}. Facial close-up — ${e} — plain white background`));
        lines.push('');
      }
    } else {
      lines.push('Once I have answered these 5 questions, generate the character design immediately based on this brief and my answers. Do not ask further questions or describe your plan — produce the character sheet directly.');
      lines.push('');
    }

    lines.push('Maintain exact character consistency (face, proportions, colours, costume) across all views and expressions.');
  }

  return lines.join('\n');
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════

function render() {
  renderProgress();

  const main = document.getElementById('main');
  const wrap = document.createElement('div');
  wrap.className = 'step-in';

  switch (S.step) {
    case 1: wrap.innerHTML = step1(); break;
    case 2: wrap.innerHTML = step2(); break;
    case 3: wrap.innerHTML = step3(); break;
    case 4: wrap.innerHTML = step4(); break;
  }

  main.innerHTML = '';
  main.appendChild(wrap);
}

function renderProgress() {
  const el = document.getElementById('progress-bar');
  el.innerHTML = STEPS.map((s, i) => {
    const n   = i + 1;
    const cls = S.step > n ? 'is-done' : S.step === n ? 'is-active' : '';
    const dot = S.step > n ? I.check : String(n);
    return `
      ${i > 0 ? '<div class="prog-line"></div>' : ''}
      <div class="prog-step ${cls}">
        <div class="prog-dot">${dot}</div>
        <span class="prog-label">${s.label}</span>
      </div>
    `;
  }).join('');
}

// ── Step 1: Role ─────────────────────────────────

const ACTIVE_ROLES = new Set(['uiux', 'graphic', 'artist', 'photographer']);

function step1() {
  const roles = getRoles();
  const cards = roles.map(r => {
    const active = r.custom || ACTIVE_ROLES.has(r.id);
    const sel = S.role === r.id ? 'is-selected' : '';
    const dis = !active ? 'is-disabled' : '';
    const actions = r.custom ? `
      <div class="rc-actions">
        <button class="rc-btn" onclick="onEditRole(event,'${r.id}')" title="Edit">${I.edit}</button>
        <button class="rc-btn" onclick="onDeleteRole(event,'${r.id}')" title="Delete">${I.trash}</button>
      </div>` : '';
    return `
      <div class="role-card ${sel} ${dis}" data-rid="${r.id}" onclick="onSelectRole('${r.id}')">
        <div class="rc-icon">${I[r.icon] || I.brand}</div>
        <div class="rc-name">${r.name}</div>
        <div class="rc-desc">${r.desc}</div>
        <div class="rc-soon">Coming soon</div>
        ${actions}
      </div>`;
  }).join('');

  return `
    <div class="step-header">
      <div class="step-tag">Step 1 of 4</div>
      <h1 class="step-title">${STEPS[0].title}</h1>
      <p class="step-sub">${STEPS[0].sub}</p>
    </div>
    <div class="role-grid">
      ${cards}
      <button class="add-role-card" onclick="openRoleModal()">
        <span class="arc-icon">${I.plus}</span>
        <span class="arc-label">Add Custom Role</span>
      </button>
    </div>`;
}

// ── Step 2: Content type ──────────────────────────

function step2() {
  const roles = getRoles();
  const role  = roles.find(r => r.id === S.role);

  const visible = CONTENT_TYPES.filter(ct => {
    if (ct.onlyFor    && !ct.onlyFor.includes(S.role))    return false;
    if (ct.excludeFor &&  ct.excludeFor.includes(S.role)) return false;
    return true;
  });

  const cards = visible.map(ct => {
    const sel = S.content === ct.id ? 'is-selected' : '';
    return `
      <div class="content-card ${sel}" data-cid="${ct.id}" onclick="onSelectContent('${ct.id}')">
        <button class="cc-info" title="What skills will this add?" onclick="event.stopPropagation(); openTaskInfo('${ct.id}')">${I.info}</button>
        <div class="cc-icon">${I[ct.icon] || I.brand}</div>
        <div class="cc-label">${ct.label}</div>
      </div>`;
  }).join('');

  return `
    <div class="step-header">
      <div class="step-tag">Step 2 of 4</div>
      <h1 class="step-title">${STEPS[1].title}</h1>
      <p class="step-sub">${STEPS[1].sub}</p>
    </div>
    ${role ? `<div class="summary-bar"><div class="summary-item">Role: <b>${role.name}</b></div></div>` : ''}
    <div class="content-grid">${cards}</div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">${ico('arrowL')} Back</button>
      <div></div>
    </div>`;
}

// ── Step 3: Details form ──────────────────────────

function step3() {
  const roles   = getRoles();
  const role    = roles.find(r => r.id === S.role);
  const content = CONTENT_TYPES.find(c => c.id === S.content);
  if (!content) return '';

  const fields = renderFieldsWithSections(content);

  return `
    <div class="step-header">
      <div class="step-tag">Step 3 of 4</div>
      <h1 class="step-title">${STEPS[2].title}</h1>
      <p class="step-sub">${STEPS[2].sub}</p>
    </div>
    <div class="summary-bar">
      <div class="summary-item">Role: <b>${role?.name || ''}</b></div>
      <div class="summary-sep"></div>
      <div class="summary-item">Creating: <b>${content.label}</b></div>
    </div>
    <div class="form-stack">${fields}</div>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">${ico('arrowL')} Back</button>
      <button class="btn-primary" onclick="onGenerate()">
        Generate Prompt ${ico('arrowR')}
      </button>
    </div>`;
}

function renderFieldsWithSections(content) {
  const out = [];
  let inCollapsed = false;
  let collapsedFields = [];
  let collapsedLabel = '';
  let advCounter = 0;

  const flushCollapsed = () => {
    if (!inCollapsed) return;
    const aid = `adv-${advCounter++}`;
    out.push(`
      <div class="advanced-section">
        <button class="advanced-toggle" type="button" onclick="toggleAdvanced(this,'${aid}')">
          <span>${esc(collapsedLabel)}</span>
          <span class="advanced-chev">${I.arrowR}</span>
        </button>
        <div class="advanced-panel" id="${aid}" hidden>
          ${collapsedFields.join('')}
        </div>
      </div>`);
    inCollapsed = false;
    collapsedFields = [];
    collapsedLabel = '';
  };

  content.fields.forEach(f => {
    if (f.type === 'section') {
      flushCollapsed();
      if (f.collapsed) {
        inCollapsed = true;
        collapsedLabel = f.label;
      } else {
        out.push(`<h2 class="form-section-title">${esc(f.label)}</h2>`);
      }
      return;
    }
    const rendered = renderField(f);
    if (inCollapsed) collapsedFields.push(rendered);
    else out.push(rendered);
  });
  flushCollapsed();
  return out.join('');
}

function toggleAdvanced(btn, panelId) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const open = panel.hasAttribute('hidden') ? false : true;
  if (open) { panel.setAttribute('hidden', ''); btn.classList.remove('is-open'); }
  else      { panel.removeAttribute('hidden'); btn.classList.add('is-open'); }
}

function renderField(f) {
  if (f.type === 'section') return '';
  const val      = esc(S.form[f.id] || '');
  const toggleOn = S.toggles[f.id] || false;
  const selChips = S.chips[f.id] || [];
  const optBadge = f.required === false ? `<span class="opt-tag">optional</span>` : '';
  const reqStar  = f.required !== false ? `<span class="req">*</span>` : '';

  let inner = '';

  if (f.type === 'text') {
    inner = `
      <div class="field">
        <label class="field-label" for="fi-${f.id}">${f.label} ${reqStar}${optBadge}</label>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <input class="fi" id="fi-${f.id}" type="text" placeholder="${esc(f.placeholder || '')}" value="${val}" oninput="S.form['${f.id}']=this.value">
      </div>`;
  }

  else if (f.type === 'textarea') {
    inner = `
      <div class="field">
        <label class="field-label" for="fi-${f.id}">${f.label} ${reqStar}${optBadge}</label>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <textarea class="fi" id="fi-${f.id}" placeholder="${esc(f.placeholder || '')}" oninput="S.form['${f.id}']=this.value">${val}</textarea>
      </div>`;
  }

  else if (f.type === 'select') {
    const opts = f.options.map(o =>
      `<option value="${esc(o)}" ${S.form[f.id] === o ? 'selected' : ''}>${o}</option>`
    ).join('');
    inner = `
      <div class="field">
        <label class="field-label" for="fi-${f.id}">${f.label} ${reqStar}</label>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <select class="fi" id="fi-${f.id}" onchange="S.form['${f.id}']=this.value; updateConditionals('${f.id}')">
          <option value="">— Select —</option>
          ${opts}
        </select>
      </div>`;
  }

  else if (f.type === 'toggle') {
    inner = `
      <div class="field">
        <div class="field-label">${f.label}</div>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <div class="toggle-row" onclick="onToggle('${f.id}')">
          <div class="toggle-track ${toggleOn ? 'is-on' : ''}" id="tt-${f.id}"></div>
          <span class="toggle-label-text" id="tl-${f.id}">${toggleOn ? 'Yes' : 'No'}</span>
        </div>
      </div>`;
  }

  else if (f.type === 'range') {
    const rVal = S.form[f.id] !== undefined ? S.form[f.id] : (f.default !== undefined ? f.default : 50);
    const pct  = ((rVal - (f.min || 0)) / ((f.max || 100) - (f.min || 0))) * 100;
    inner = `
      <div class="field">
        <div class="field-label">${f.label}</div>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <div class="range-wrap">
          <input class="range-input" type="range"
            min="${f.min || 0}" max="${f.max || 100}" step="${f.step || 10}"
            value="${rVal}" style="--fill:${pct}%"
            oninput="onRange('${f.id}', this)">
          <div class="range-row">
            <span class="range-end">${f.minLabel || 'Loose'}</span>
            <span class="range-current" id="rl-${f.id}">${getRangeLabel(rVal, f)}</span>
            <span class="range-end">${f.maxLabel || 'Tight'}</span>
          </div>
        </div>
      </div>`;
  }

  else if (f.type === 'chips' || f.type === 'chips-one') {
    const single = f.type === 'chips-one';
    const badge  = single ? '<span class="opt-tag">choose one</span>' : '<span class="opt-tag">select all that apply</span>';
    const chips  = f.options.map(o => {
      const sel = selChips.includes(o) ? 'is-selected' : '';
      return `<div class="chip ${sel}" data-field="${f.id}" data-val="${esc(o)}" data-single="${single}" onclick="onChip(this)">${o}</div>`;
    }).join('');
    inner = `
      <div class="field">
        <div class="field-label">${f.label} ${badge}</div>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <div class="chips-wrap">${chips}</div>
      </div>`;
  }

  else if (f.type === 'chips-grouped') {
    const renderGroup = g => {
      const chips = g.options.map(o => {
        const sel = selChips.includes(o) ? 'is-selected' : '';
        return `<div class="chip ${sel}" data-field="${f.id}" data-val="${esc(o)}" data-single="false" onclick="onChip(this)">${o}</div>`;
      }).join('');
      return `
        <div class="chips-group">
          <div class="chips-group-label">${g.label}</div>
          <div class="chips-wrap">${chips}</div>
        </div>`;
    };
    const visible = f.groups.filter(g => !g.collapsed);
    const collapsedGroups = f.groups.filter(g => g.collapsed);
    let primaryBlock;
    if (visible.length === 1) {
      // Single visible group → render as plain chips (no bordered container, no group label)
      const chips = visible[0].options.map(o => {
        const sel = selChips.includes(o) ? 'is-selected' : '';
        return `<div class="chip ${sel}" data-field="${f.id}" data-val="${esc(o)}" data-single="false" onclick="onChip(this)">${o}</div>`;
      }).join('');
      primaryBlock = `<div class="chips-wrap">${chips}</div>`;
    } else {
      primaryBlock = `<div class="chips-grouped-wrap">${visible.map(renderGroup).join('')}</div>`;
    }
    let expander = '';
    if (collapsedGroups.length) {
      const hasSel = collapsedGroups.some(g => g.options.some(o => selChips.includes(o)));
      const moreLabel = f.expandLabel || 'More sizes';
      expander = `
        <button type="button" class="chips-more-toggle ${hasSel ? 'is-open' : ''}" aria-expanded="${hasSel}" onclick="toggleChipsMore(this)">
          <span class="chips-more-text">${moreLabel}</span><span class="chips-more-caret">▾</span>
        </button>
        <div class="chips-grouped-wrap chips-more-panel" ${hasSel ? '' : 'hidden'}>${collapsedGroups.map(renderGroup).join('')}</div>`;
    }
    inner = `
      <div class="field">
        <div class="field-label">${f.label} <span class="opt-tag">select all that apply</span></div>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        ${primaryBlock}
        ${expander}
      </div>`;
  }

  else if (f.type === 'refpicker') {
    const refs = S.refs[f.id] || [];
    const rows = refs.map((r, i) => {
      if (r.type === 'url') {
        return `
          <div class="ref-row">
            <span class="ref-icon">${I.link}</span>
            <input class="ref-input" type="text" value="${esc(r.value)}" placeholder="https://…"
                   oninput="onRefUrl('${f.id}',${i},this.value)">
            <button class="ref-remove" onclick="removeRef('${f.id}',${i})">${I.trash}</button>
          </div>`;
      } else {
        return `
          <div class="ref-row">
            <img class="ref-thumb" src="${r.thumb}" alt="${esc(r.name)}">
            <span class="ref-filename">${esc(r.name)}</span>
            <button class="ref-remove" onclick="removeRef('${f.id}',${i})">${I.trash}</button>
          </div>`;
      }
    }).join('');
    inner = `
      <div class="field" id="rffield-${f.id}">
        <div class="field-label">${f.label} ${optBadge}</div>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        ${rows ? `<div class="ref-list">${rows}</div>` : ''}
        <div class="ref-add-row">
          <button class="ref-add-btn" onclick="addRefUrl('${f.id}')">${I.link} Add URL</button>
          <label class="ref-add-btn" style="cursor:pointer">
            ${I.image} Add image
            <input type="file" accept="image/*" style="display:none" onchange="onRefFile('${f.id}',this)">
          </label>
        </div>
      </div>`;
  }

  else if (f.type === 'colorpicker') {
    const colors = getColors(f.id);
    const rows = colors.map((c, i) => `
        <div class="cp-row">
          <div class="cp-swatch-wrap">
            <div class="cp-swatch" style="background:${c.hex}"></div>
            <input type="color" value="${c.hex}" oninput="onColorChange('${f.id}',${i},this.value)">
          </div>
          <span class="cp-hex">${c.hex}</span>
          <input class="cp-label" type="text" value="${esc(c.label)}" placeholder="Label" oninput="onColorLabel('${f.id}',${i},this.value)">
          <button class="cp-remove" onclick="removeColor('${f.id}',${i})" title="Remove">${I.trash}</button>
        </div>`
    ).join('');
    const canAdd = colors.length < 8;
    inner = `
      <div class="field" id="cpfield-${f.id}">
        <div class="field-label">${f.label} ${optBadge}</div>
        ${colors.length === 0
          ? `<div class="cp-empty">No colours defined — the AI will choose a palette that fits your brief.</div>`
          : `<div class="cp-grid">${rows}</div>`}
        ${canAdd ? `<button class="cp-add" onclick="addColor('${f.id}')">${I.plus} Add colour</button>` : ''}
      </div>`;
  }

  else if (f.type === 'colorstrategy') {
    const mode = S.form[f.id + '_mode'] || f.defaultColorMode || 'ai';
    const showBW = f.defaultColorMode === 'bw';
    inner = `
      <div class="field" id="csfield-${f.id}">
        <div class="field-label">${f.label} ${optBadge}</div>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ''}
        <div class="cs-tabs">
          ${showBW ? `<button class="cs-tab ${mode==='bw'?'is-active':''}" onclick="setColorMode('${f.id}','bw')">Start in B&amp;W</button>` : ''}
          <button class="cs-tab ${mode==='manual'?'is-active':''}" onclick="setColorMode('${f.id}','manual')">Pick colours</button>
          <button class="cs-tab ${mode==='upload'?'is-active':''}" onclick="setColorMode('${f.id}','upload')">Upload palette</button>
          <button class="cs-tab ${mode==='ai'    ?'is-active':''}" onclick="setColorMode('${f.id}','ai')">Let AI decide</button>
        </div>
        ${buildCSContent(f.id, mode)}
      </div>`;
  }

  if (!inner) return '';

  // Universal showIf wrapper — works for all field types
  if (f.showIf) {
    const condMet = isCondMet(f.showIf);
    return `<div id="cond-${f.id}" style="${condMet ? '' : 'display:none'}">${inner}</div>`;
  }
  return inner;
}

// ── Step 4: Output ────────────────────────────────

function getAttachableImages() {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return [];
  const images = [];
  ct.fields.forEach(f => {
    if (f.type === 'refpicker') {
      (S.refs[f.id] || []).filter(r => r.type === 'file' && r.thumb).forEach(r => {
        images.push({ label: f.label, name: r.name, thumb: r.thumb });
      });
    }
    if (f.type === 'colorstrategy' && (S.form[f.id + '_mode'] || 'ai') === 'upload') {
      const pal = S.refs[f.id + '_palette'];
      if (pal) images.push({ label: 'Colour Palette Reference', name: pal.name, thumb: pal.thumb, isPalette: true });
    }
  });
  return images;
}

function step4() {
  const prompt   = buildPrompt();
  const roles    = getRoles();
  const role     = roles.find(r => r.id === S.role);
  const ct       = CONTENT_TYPES.find(c => c.id === S.content);
  const attachImages = getAttachableImages();

  const attachPanel = attachImages.length ? `
    <div class="attach-callout">
      <div class="attach-header">
        <div class="attach-header-icon">📎</div>
        <div class="attach-header-text">
          <div class="attach-header-title">Attach ${attachImages.length === 1 ? 'this image' : 'these images'} to your AI conversation</div>
          <div class="attach-header-sub">The prompt references ${attachImages.length === 1 ? 'this file' : 'these files'} — paste them directly into the chat alongside the prompt.</div>
        </div>
      </div>
      <div class="attach-images">
        ${attachImages.map(img => `
          <div class="attach-item">
            <img class="attach-thumb" src="${img.thumb}" alt="${esc(img.name)}">
            <div class="attach-item-info">
              <div class="attach-item-label">${esc(img.label)}</div>
              <div class="attach-item-name">${esc(img.name)}</div>
            </div>
            <a class="attach-dl-btn" href="${img.thumb}" download="${esc(img.name)}">↓ Download</a>
          </div>`).join('')}
      </div>
    </div>` : '';

  return `
    <div class="step-header">
      <div class="step-tag">Step 4 of 4</div>
      <h1 class="step-title">${STEPS[3].title}</h1>
      <p class="step-sub">${STEPS[3].sub}</p>
    </div>
    <div class="summary-bar">
      <div class="summary-item">Role: <b>${role?.name || ''}</b></div>
      <div class="summary-sep"></div>
      <div class="summary-item">Creating: <b>${ct?.label || ''}</b></div>
      <div class="summary-sep"></div>
      <div class="summary-item"><b>${prompt.length}</b> characters</div>
    </div>
    <div class="output-card">
      <div class="output-topbar">
        <div class="output-meta">
          <span class="output-badge">Prompt</span>
          <span class="output-chars">Ready to paste</span>
        </div>
        <button class="copy-btn" id="copy-btn" onclick="onCopy()">
          ${ico('copy2')} <span id="copy-label">Copy Prompt</span>
        </button>
      </div>
      <div class="output-body" id="output-body">${esc(prompt)}</div>
    </div>
    ${attachPanel}
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">${ico('arrowL')} Back</button>
      <button class="btn-ghost" onclick="onStartOver()">
        ${ico('refresh')} Start Over
      </button>
    </div>`;
}

function openRoleModal(existing = null) {
  const isEdit = !!existing;
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">${I.close}</button>
        <h2 class="modal-title">${isEdit ? 'Edit Role' : 'Add Custom Role'}</h2>
        <div class="form-stack">
          <div class="field">
            <label class="field-label" for="m-name">Role Name <span class="req">*</span></label>
            <input class="fi" id="m-name" type="text" placeholder="e.g. Frontend Developer" value="${esc(existing?.name || '')}">
          </div>
          <div class="field">
            <label class="field-label" for="m-desc">Description <span class="req">*</span></label>
            <input class="fi" id="m-desc" type="text" placeholder="Short description of this role's expertise" value="${esc(existing?.desc || '')}">
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-back" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="onSaveRole('${existing?.id || ''}')">
            ${isEdit ? 'Save Changes' : 'Add Role'} ${ico('arrowR')}
          </button>
        </div>
      </div>
    </div>`;
}

function closeModal(e) {
  if (!e || e.target === e.currentTarget) {
    document.getElementById('modal-root').innerHTML = '';
  }
}

function openTaskInfo(contentId) {
  const ct = CONTENT_TYPES.find(c => c.id === contentId);
  if (!ct) return;
  const roles = getRoles();
  const role  = roles.find(r => r.id === S.role);

  const subSection = (label, body) => `
    <div class="info-sub">
      <h4>${esc(label)}</h4>
      ${body}
    </div>`;
  const para = (text) => `<p>${esc(text)}${/[.!?]$/.test(text) ? '' : '.'}</p>`;
  const list = (items) => `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;

  const groups = [];

  // Slim override: single block, no role+task split
  if (ct.slimPrompt) {
    groups.push(`
      <div class="info-group">
        <h3>Prompt injection for ${esc(ct.label)}</h3>
        <div class="info-slim">${esc(ct.slimPrompt)}</div>
      </div>`);
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-backdrop" onclick="closeModal(event)">
        <div class="modal modal-wide" onclick="event.stopPropagation()">
          <button class="modal-close" onclick="closeModal()">${I.close}</button>
          <h2 class="modal-title">${esc(ct.label)} — skills preview</h2>
          <p class="info-meta">This task uses a slim, self-contained prompt instead of layering the full role injection.</p>
          <div class="modal-body">${groups.join('')}</div>
          <div class="modal-actions">
            <button class="btn-primary" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>`;
    return;
  }

  // ── Group 1: Role ───────────────────────────────
  if (role) {
    const roleParts = [];
    roleParts.push(`<p class="info-lede">You are an expert <b>${esc(role.name)}</b>${role.desc ? ` — ${esc(role.desc)}` : ''}.</p>`);
    if (role.keywords)                              roleParts.push(subSection('Core expertise', para(role.keywords)));
    if (role.optimizeFor && role.optimizeFor.length) roleParts.push(subSection('Optimize for', list(role.optimizeFor)));
    if (role.guidance && role.guidance.length)       roleParts.push(subSection('When responding', list(role.guidance)));
    groups.push(`
      <div class="info-group">
        <h3>Role</h3>
        ${roleParts.join('')}
      </div>`);
  }

  // ── Group 2: Skillset for this task ─────────────
  const hasTaskContent = ct.taskExpertise || (ct.optimizeFor || []).length || (ct.guidance || []).length;
  if (hasTaskContent) {
    const taskParts = [];
    if (ct.taskExpertise)                           taskParts.push(subSection('Skills', para(ct.taskExpertise)));
    if (ct.optimizeFor && ct.optimizeFor.length)    taskParts.push(subSection('Optimize for', list(ct.optimizeFor)));
    if (ct.guidance && ct.guidance.length)          taskParts.push(subSection('When responding', list(ct.guidance)));
    groups.push(`
      <div class="info-group">
        <h3>Skillset for ${esc(ct.label)}</h3>
        ${taskParts.join('')}
      </div>`);
  } else {
    groups.push(`
      <div class="info-group">
        <h3>Skillset for ${esc(ct.label)}</h3>
        <p class="info-empty">No task-specific skills defined yet for ${esc(ct.label)} — only the role-level skills above will be added.</p>
      </div>`);
  }

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal modal-wide" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">${I.close}</button>
        <h2 class="modal-title">${esc(ct.label)} — skills preview</h2>
        <p class="info-meta">These are the skills that will be added to the prompt when you choose <b>${esc(ct.label)}</b>${role ? ` as a <b>${esc(role.name)}</b>` : ''}.</p>
        <div class="modal-body">${groups.join('')}</div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════

function onSelectRole(id) {
  S.role = id;
  confirmCardAndAdvance(`.role-card[data-rid="${id}"]`);
}

function onSelectContent(id) {
  if (S.content !== id) {
    S.content = id;
    S.form = {};
    S.chips = {};
    S.toggles = {};
    S.colors = {};
    S.refs = {};
    seedChipDefaults();
  }
  confirmCardAndAdvance(`.content-card[data-cid="${id}"]`);
}

function seedChipDefaults() {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return;
  ct.fields.forEach(f => {
    if (!(f.type === 'chips-one' || f.type === 'chips') || !Array.isArray(f.options)) return;
    const aiOption = f.options.find(o => /let ai decide/i.test(o));
    if (aiOption && (!S.chips[f.id] || !S.chips[f.id].length)) {
      S.chips[f.id] = [aiOption];
    }
  });
}

function confirmCardAndAdvance(cardSelector) {
  const cardClass = cardSelector.startsWith('.role-card') ? 'role-card' : 'content-card';
  document.querySelectorAll('.' + cardClass).forEach(c => c.classList.remove('is-selected'));
  const card = document.querySelector(cardSelector);
  if (card) card.classList.add('is-selected', 'is-confirmed');
  const wrap = document.querySelector('#main > .step-in');
  setTimeout(() => {
    if (wrap) {
      wrap.classList.remove('step-in');
      wrap.classList.add('step-out');
    }
    setTimeout(nextStep, 200);
  }, 320);
}

function onToggle(id) {
  S.toggles[id] = !S.toggles[id];
  const track = document.getElementById(`tt-${id}`);
  const label = document.getElementById(`tl-${id}`);
  if (track) track.classList.toggle('is-on');
  if (label) label.textContent = S.toggles[id] ? 'Yes' : 'No';
  updateConditionals(id);
}

function getRangeLabel(val, f) {
  if (!f.rangeLabels) return String(val);
  const keys = Object.keys(f.rangeLabels).map(Number).sort((a, b) => a - b);
  let label = f.rangeLabels[keys[0]];
  for (const k of keys) { if (val >= k) label = f.rangeLabels[k]; }
  return label;
}

function onRange(id, input) {
  const val = parseInt(input.value);
  S.form[id] = val;
  const pct = ((val - parseInt(input.min || 0)) / (parseInt(input.max || 100) - parseInt(input.min || 0))) * 100;
  input.style.setProperty('--fill', pct + '%');
  const content = CONTENT_TYPES.find(c => c.id === S.content);
  const f = content && content.fields.find(f => f.id === id);
  const labelEl = document.getElementById('rl-' + id);
  if (labelEl && f) labelEl.textContent = getRangeLabel(val, f);
}

function onChip(el) {
  const { field, val, single } = el.dataset;
  const isSingle = single === 'true';
  if (!S.chips[field]) S.chips[field] = [];

  if (isSingle) {
    S.chips[field] = S.chips[field].includes(val) ? [] : [val];
  } else {
    const idx = S.chips[field].indexOf(val);
    idx > -1 ? S.chips[field].splice(idx, 1) : S.chips[field].push(val);
  }

  document.querySelectorAll(`[data-field="${field}"]`).forEach(c => {
    c.classList.toggle('is-selected', S.chips[field].includes(c.dataset.val));
  });

  updateConditionals(field);
}

function toggleChipsMore(btn) {
  const panel = btn.nextElementSibling;
  if (!panel) return;
  const open = panel.hasAttribute('hidden');
  panel.toggleAttribute('hidden', !open);
  btn.classList.toggle('is-open', open);
  btn.setAttribute('aria-expanded', String(open));
}

function nextStep() {
  if (S.step < 4) { S.step++; render(); scrollTo({ top: 0, behavior: 'smooth' }); }
}

function prevStep() {
  if (S.step > 1) { S.step--; render(); scrollTo({ top: 0, behavior: 'smooth' }); }
}

function onGenerate() {
  // Flush any textarea/input values that might not have fired oninput
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (ct) {
    ct.fields.forEach(f => {
      if (['text','textarea','select'].includes(f.type)) {
        const el = document.getElementById(`fi-${f.id}`);
        if (el) S.form[f.id] = el.value;
      }
    });
  }
  nextStep();
}

function onCopy() {
  const prompt = buildPrompt();
  navigator.clipboard.writeText(prompt).then(() => {
    const btn   = document.getElementById('copy-btn');
    const label = document.getElementById('copy-label');
    if (btn) btn.classList.add('is-copied');
    if (label) label.textContent = 'Copied!';
    setTimeout(() => {
      if (btn) btn.classList.remove('is-copied');
      if (label) label.textContent = 'Copy Prompt';
    }, 2200);
  }).catch(() => {
    // Fallback for non-https
    const ta = document.createElement('textarea');
    ta.value = buildPrompt();
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function onStartOver() {
  S = { step: 1, role: null, content: null, form: {}, toggles: {}, chips: {} };
  render();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function onEditRole(e, id) {
  e.stopPropagation();
  const role = getRoles().find(r => r.id === id);
  if (role) openRoleModal(role);
}

function onDeleteRole(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this custom role?')) return;
  const roles = getRoles().filter(r => r.id !== id);
  setRoles(roles);
  if (S.role === id) S.role = null;
  render();
}

function onSaveRole(existingId) {
  const name = document.getElementById('m-name')?.value.trim();
  const desc = document.getElementById('m-desc')?.value.trim();
  if (!name || !desc) { alert('Please fill in both fields.'); return; }

  const roles = getRoles();
  if (existingId) {
    const r = roles.find(r => r.id === existingId);
    if (r) { r.name = name; r.desc = desc; }
  } else {
    roles.push({ id: 'c_' + Date.now(), name, desc, icon: 'brand', custom: true });
  }
  setRoles(roles);
  closeModal();
  render();
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════════════
//  CONDITIONALS
// ═══════════════════════════════════════════════════

function redrawRefField(fieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  const f  = ct?.fields.find(fi => fi.id === fieldId);
  const el = document.getElementById(`rffield-${fieldId}`);
  if (f && el) el.outerHTML = renderField(f);
  updateConditionals(fieldId);
}

function addRefUrl(fieldId) {
  if (!S.refs[fieldId]) S.refs[fieldId] = [];
  S.refs[fieldId].push({ type: 'url', value: '' });
  redrawRefField(fieldId);
  // Focus the new input
  setTimeout(() => {
    const rows = document.querySelectorAll(`#rffield-${fieldId} .ref-input`);
    if (rows.length) rows[rows.length - 1].focus();
  }, 0);
}

function onRefUrl(fieldId, idx, value) {
  if (S.refs[fieldId]) S.refs[fieldId][idx].value = value;
}

function onRefFile(fieldId, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (!S.refs[fieldId]) S.refs[fieldId] = [];
    S.refs[fieldId].push({ type: 'file', name: file.name, thumb: e.target.result });
    redrawRefField(fieldId);
  };
  reader.readAsDataURL(file);
}

function removeRef(fieldId, idx) {
  if (S.refs[fieldId]) S.refs[fieldId].splice(idx, 1);
  redrawRefField(fieldId);
}

function getColors(fieldId) {
  if (!S.colors[fieldId]) S.colors[fieldId] = [];
  return S.colors[fieldId];
}

// ── Color strategy helpers ────────────────────────

function buildCSContent(fieldId, mode) {
  if (mode === 'manual') {
    const colors = getColors(fieldId);
    const rows = colors.map((c, i) => `
      <div class="cp-row">
        <div class="cp-swatch-wrap">
          <div class="cp-swatch" style="background:${c.hex}"></div>
          <input type="color" value="${c.hex}" oninput="onColorChange('${fieldId}',${i},this.value)">
        </div>
        <span class="cp-hex">${c.hex}</span>
        <input class="cp-label" type="text" value="${esc(c.label)}" placeholder="Label" oninput="onColorLabel('${fieldId}',${i},this.value)">
        <button class="cp-remove" onclick="removeColorCS('${fieldId}',${i})" title="Remove">${I.trash}</button>
      </div>`).join('');
    const canAdd = colors.length < 8;
    return `
      ${colors.length === 0 ? `<div class="cp-empty">No colours added yet.</div>` : `<div class="cp-grid">${rows}</div>`}
      ${canAdd ? `<button class="cp-add" onclick="addColorCS('${fieldId}')">${I.plus} Add colour</button>` : ''}`;
  }
  if (mode === 'upload') {
    const pal = S.refs[fieldId + '_palette'];
    if (pal) {
      return `
        <div class="cs-palette-preview">
          <img class="cs-palette-thumb" src="${pal.thumb}" alt="${esc(pal.name)}">
          <div>
            <div class="cs-palette-name">${esc(pal.name)}</div>
            <button class="cp-remove" style="display:inline-flex;gap:5px;padding:4px 8px;border-radius:6px" onclick="removePaletteImage('${fieldId}')">${I.trash} Remove</button>
          </div>
        </div>`;
    }
    return `
      <label class="cs-upload-btn">
        <input type="file" accept="image/*" style="display:none" onchange="uploadPaletteImage('${fieldId}',this)">
        ${I.plus} Upload palette image
      </label>
      <div class="field-hint" style="margin-top:6px">Upload a mood board, brand guide, or any image — the AI will base the colour palette on it.</div>`;
  }
  if (mode === 'bw') {
    return `<div class="cs-ai-note">Start in black and white. Colour can be added once the silhouette and form are working.</div>`;
  }
  // ai
  return `<div class="cs-ai-note">The AI will choose a colour palette that best fits your brief and tone.</div>`;
}

function setColorMode(fieldId, mode) {
  S.form[fieldId + '_mode'] = mode;
  redrawColorStrategy(fieldId);
}

function redrawColorStrategy(fieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  const f  = ct?.fields.find(fi => fi.id === fieldId);
  const el = document.getElementById(`csfield-${fieldId}`);
  if (f && el) el.outerHTML = renderField(f);
}

function addColorCS(fieldId) {
  const colors = getColors(fieldId);
  if (colors.length >= 8) return;
  colors.push({ label: COLOR_LABELS[colors.length] || 'Extra', hex: '#888888' });
  redrawColorStrategy(fieldId);
}

function removeColorCS(fieldId, idx) {
  getColors(fieldId).splice(idx, 1);
  redrawColorStrategy(fieldId);
}

function uploadPaletteImage(fieldId, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    S.refs[fieldId + '_palette'] = { name: file.name, thumb: e.target.result };
    redrawColorStrategy(fieldId);
  };
  reader.readAsDataURL(file);
}

function removePaletteImage(fieldId) {
  delete S.refs[fieldId + '_palette'];
  redrawColorStrategy(fieldId);
}

// ─────────────────────────────────────────────────

function onColorChange(fieldId, idx, hex) {
  getColors(fieldId)[idx].hex = hex;
  const wrapper = document.getElementById(`cpfield-${fieldId}`) || document.getElementById(`csfield-${fieldId}`);
  const row = wrapper?.querySelectorAll('.cp-row')[idx];
  if (row) {
    row.querySelector('.cp-swatch').style.background = hex;
    row.querySelector('.cp-hex').textContent = hex;
  }
}

function onColorLabel(fieldId, idx, label) {
  getColors(fieldId)[idx].label = label;
}

function redrawColorField(fieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  const f  = ct?.fields.find(fi => fi.id === fieldId);
  const el = document.getElementById(`cpfield-${fieldId}`);
  if (f && el) el.outerHTML = renderField(f);
}

const COLOR_LABELS = ['Primary', 'Secondary', 'Accent', 'Highlight', 'Dark', 'Light', 'Neutral', 'Extra'];

function addColor(fieldId) {
  const colors = getColors(fieldId);
  if (colors.length >= 8) return;
  const label = COLOR_LABELS[colors.length] || 'Extra';
  colors.push({ label, hex: '#888888' });
  redrawColorField(fieldId);
}

function removeColor(fieldId, idx) {
  const colors = getColors(fieldId);
  colors.splice(idx, 1);
  redrawColorField(fieldId);
}

function isCondMet(showIf) {
  if (showIf.src === 'refs') {
    return (S.refs[showIf.field] || []).length > 0;
  }
  if (showIf.src === 'chips') {
    return (S.chips[showIf.field] || []).includes(showIf.value);
  }
  if (showIf.src === 'toggle') {
    return !!S.toggles[showIf.field] === showIf.value;
  }
  return S.form[showIf.field] === showIf.value;
}

function updateConditionals(changedFieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return;
  ct.fields.forEach(f => {
    if (!f.showIf || f.showIf.field !== changedFieldId) return;
    const wrapper = document.getElementById(`cond-${f.id}`);
    if (!wrapper) return;
    const show = isCondMet(f.showIf);
    wrapper.style.display = show ? '' : 'none';
    if (!show) {
      S.form[f.id]   = '';
      S.chips[f.id]  = [];
      S.refs[f.id]   = [];
      const el = document.getElementById(`fi-${f.id}`);
      if (el) el.value = '';
    }
  });
}

// ═══════════════════════════════════════════════════
//  BOOT

render();
</script>
