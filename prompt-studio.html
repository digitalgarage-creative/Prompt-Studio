  const subject = content.id === 'logo' ? 'logo concept' : content.id === 'chardesign' ? 'character design image' : photo ? `${content.label.toLowerCase()} photograph` : `${content.label.toLowerCase()} image`;
  const lines = [editing
    ? say('Edit the supplied image as described below. Preserve unrelated content; allow only the necessary physical consequences of the requested change.', '指定した画像を以下の内容で編集してください。関係のない部分を保ち、変更に必要な物理的な影響だけを調整してください。')
    : say(`Create a new ${subject} from scratch. Return the generated image.`, `${t(content.label)}の画像を新規に作成し、完成した画像を返してください。`)];
  const hasImageInputs = Object.values(S.refs).some(value => (Array.isArray(value) ? value : [value]).some(r => r && (r.name || (r.type === 'url' && /^https?:\/\//i.test(r.value || '')))));
  if (!editing && hasImageInputs) lines.push(say(
    'Build a new composition using the supplied images only in their assigned roles: style references or assets to include.',
    '添付画像は指定された役割（スタイルの参考、または作品に入れる素材）に従って使い、新しい構図を作成してください。'
  ));
  const fields = resolveFields(content);
  const description = fields.find(f => f.type === 'textarea' && f.required === true);
  const idea = description && (S.form[description.id] || '').trim();
  if (idea) lines.push('', idea);
  const add = (label, value) => { if (value) lines.push(`${label}: ${value}`); };
  const exactWords = new Set(content.id === 'poster' ? ['copy'] : content.id === 'banner' ? ['headline','subheadline','ctaText','mustText'] : content.id === 'bookcover' ? ['title','subtitle','author'] : []);
  let hasWords = false;
  fields.forEach(f => {
    if (f.type === 'section' || (f.showIf && !isCondMet(f.showIf)) || isSuperseded(f)) return;
    if (f.id === 'visualDirection' || f.cameraCustomFor) return;
    if (f === description || /^(sizeCustom|sizesCustom|textMode|charInclude)$/.test(f.id)) return;
    const label = t(f.promptLabel || f.label);
    if (f.type === 'refpicker') {
      (S.refs[f.id] || []).forEach(r => {
        const name = r.type === 'url' ? r.value.trim() : r.name;
        if (!name) return;
        const use = f.assetKind === 'source' ? say('Image to edit','編集する画像')
          : f.assetKind === 'product' ? say('Use this product, preserving its appearance','この商品の見た目を保って使用')
          : f.assetMode || (content.id !== 'banner' && r.use === 'Include this image') ? say('Include this image in the design','作品に入れる画像')
          : say(`Reference for ${(r.use || REF_USE_DEFAULT).toLowerCase()}`, `${t(r.use || REF_USE_DEFAULT)}の参考画像`);
        add(use, name);
        if (r.borrow?.trim()) add(say('Borrow from this reference','この参考から取り入れるもの'), r.borrow.trim());
        if (r.ignore?.trim()) add(say('Do not borrow from this reference','この参考から取り入れないもの'), r.ignore.trim());
        if ((r.use || '').toLowerCase().includes('layout')) lines.push(say('If this is a sketch, use its arrangement only; omit guide lines, arrows and annotations unless requested as artwork.', 'スケッチの場合は配置だけを参考にし、指定がなければ補助線、矢印、注釈を作品に描かないでください。'));
        if (content.id === 'banner' && !f.assetMode) lines.push(say('Use this reference for visual direction only; do not place the reference image itself in the design.', 'この参考画像は見た目の方向性だけに使い、画像そのものを作品に入れないでください。'));
      });
    } else if (f.type === 'colorstrategy' || f.type === 'colorpicker') {
      const mode = f.type === 'colorpicker' ? 'manual' : S.form[f.id + '_mode'] || f.defaultColorMode || 'ai';
      if (mode === 'manual') add(label, (S.colors[f.id] || []).map(c => `${c.label}: ${c.hex}`).join(', '));
      if (mode === 'bw') add(label, say('Black and white','白黒'));
      const palette = S.refs[f.id + '_palette'];
      if (mode === 'upload' && palette) add(say('Use the colours from','色の参考画像'), palette.name);
    } else if (f.type === 'range') {
      // Unchanged sliders should not add hidden defaults to a simple request.
      if (f.referenceField) {
        const value = S.form[f.id] === undefined || S.form[f.id] === '' ? f.default : Number(S.form[f.id]);
        add(label + ' (' + t(fields.find(x => x.id === f.referenceField)?.label || f.referenceField) + ')', t(f.promptMap[value]));
      } else if (S.form[f.id] !== undefined) add(label, getRangeLabel(S.form[f.id], f));
    } else if (f.type === 'toggle') {
      if (S.toggles[f.id]) add(label, t('Yes'));
    } else if (f.type.startsWith('chips')) {
      let choices = (S.chips[f.id] || []).filter(v => !/let ai decide|not sure|AI's best choice/i.test(v));
      if (!choices.length) return;
      const custom = fields.find(x => x.showIf?.field === f.id && x.showIf.value === 'Custom');
      choices = choices.map(v => v === 'Custom' ? (S.form[custom?.id] || '').trim() : t(v)).filter(Boolean);
      if (content.id === 'chardesign' && ['angles','expressions'].includes(f.id)) {
        add(say(f.id === 'angles' ? 'Separate full-body images for these views' : 'Separate facial close-ups for these expressions', f.id === 'angles' ? '各方向を別々の全身画像に' : '各表情を別々の顔のアップに'), choices.join(', '));
      } else if (f.multiPrompt && choices.length > 1) {
        add(say('Create a separate image for each size','各サイズで別々の画像を作成'), choices.join(', '));
      } else add(label, choices.join(ja ? '、' : ', '));
      if (f.styleRegistry === 'illustration') {
        for (const choice of (S.chips[f.id] || [])) {
          const style = EXTENDED_ILLUSTRATION_STYLES[choice];
          if (style) lines.push(say('Style guidance', 'スタイルの指針') + ' (' + t(choice) + '): ' + t(style.inject) + ' ' + t(style.avoid));
        }
        if ((S.chips[f.id] || []).some(choice => EXTENDED_ILLUSTRATION_STYLES[choice])) lines.push(say('Apply style guidance only where compatible with my subject, exact text, reference roles and explicit custom instructions. Those requirements take priority.', 'スタイルの指針は主題、正確な文言、参考の役割、明示的な自由入力の指定に合う範囲で適用し、それらの条件を優先してください。'));
      }
    } else {
      const value = CAMERA_OPTIONS[f.id] ? cameraValue(f.id) : (S.form[f.id] || '').trim();
      if (value && exactWords.has(f.id)) {
        hasWords = true;
        add(say(`Exact wording (${label})`, `掲載する文字（${label}）`), value);
      } else add(label, value);
    }
  });
  const directionKey = (CONTENT_DIRECTIONS[content.id] || []).find(k => VISUAL_DIRECTIONS[k].name === (S.chips.visualDirection || [])[0]);
  if (directionKey) {
    const d = VISUAL_DIRECTIONS[directionKey];
    lines.push('', say('Visual direction: ' + d.name + '. ' + d.prompt, '見た目の方向性：' + d.nameJa + '。' + d.promptJa), say('Apply this direction only where it agrees with my brief, custom style notes, reference instructions and reference closeness. Those take priority.', 'この方向性は依頼内容、自由入力のスタイル、参考画像の指定と忠実度に合う範囲で適用し、それらの指定を優先してください。'));
  }
  if (guidance) lines.push('', say(
    'For choices left open, and only where consistent with my instructions and references: ' + guidance[0],
    '未指定の点に限り、依頼内容と参考画像に合う範囲で：' + guidance[1]
  ));
  if (content.id === 'banner') {
    const mode = (S.chips.textMode || [])[0];
    if (mode === 'Leave empty text area') lines.push(say('Leave space for text to be added later; do not render text.', '後で文字を入れるための余白を残し、文字は描かないでください。'));
    else if (mode === 'No text in image') lines.push(say('Do not add text.', '文字を入れないでください。'));
  }
  const textDisabled = content.id === 'banner' && ['No text in image', 'Leave empty text area'].includes((S.chips.textMode || [])[0]);
  if (['poster', 'banner'].includes(content.id) && !textDisabled) {
    lines.push(say(
      'Preserve supplied wording and factual details exactly, especially titles, dates, times, venues, names, prices and offers. You may add decorative or atmospheric wording that supports the design without changing its meaning. Do not invent factual details, promises or claims. Follow any explicit instructions in my brief to omit or restrict text.',
      '指定された文言と事実、特にタイトル、日付、時刻、会場、名前、価格、特典は正確に保ってください。意味を変えずにデザインを引き立てる装飾的な言葉や雰囲気づくりの文言は追加して構いません。事実、約束、宣伝上の主張を新しく作らないでください。文字を入れない、または制限するという明示的な指示がある場合は、それに従ってください。'
    ));
  } else if (hasWords && !textDisabled) {
    lines.push(say('Use the supplied wording exactly; do not invent additional text.', '指定の文字をそのまま使い、別の文章を加えないでください。'));
  }
  if ((S.form.imageChecks || '').trim()) lines.push('', say('Check the result against the stated requirements. Distinguish visible failures from anything you cannot verify; do not claim unchecked requirements passed.', '結果を指定の条件と照合してください。目視できる失敗と確認できない点を区別し、未確認の条件を合格としないでください。'));
  if (hasImageInputs) lines.push(say('Use only visible reference evidence. Do not treat hidden details as known. Explicit changes override reference appearance only for the named target.', '参考画像に見える情報だけを根拠にし、隠れた詳細を既知として扱わないでください。明示的な変更は指定した対象だけに適用してください。'));
  if (selectedBrand()) lines.push('', brandPrompt());
  if (S.toggles.helpDecide) lines.push('', say(
    `Before ${editing ? 'editing' : 'creating'} the image, ask 3 short questions together about choices I haven't specified that could improve the result, such as ${questionTopics}. Give simple suggested answers and "Choose for me". Don't repeat information I've provided. Wait for my reply, then ${editing ? 'edit' : 'create'} the image without another question round. Skip questions only if I explicitly ask you to proceed immediately or all relevant choices are already specified.`,
    `画像を${editing ? '編集' : '作成'}する前に、${questionTopics}など、まだ指定されておらず仕上がりを良くできる点について、短い質問を3つまとめて聞いてください。わかりやすい回答例と「おまかせ」を添え、指定済みの情報は聞き直さないでください。私の返答を待ち、その後は追加の質問をせずに画像を${editing ? '編集' : '作成'}してください。質問を省略するのは、私がすぐに進めるよう明示した場合か、関連する選択肢がすべて指定済みの場合だけです。`
  ));
  if (!S.toggles.helpDecide) lines.push('', say(editing ? 'Make the edit now, using your judgment for unspecified details.' : 'Create the image now, using your judgment for unspecified details.', editing ? '未指定の点はおまかせします。この内容で編集してください。' : '未指定の点はおまかせします。この内容で画像を作成してください。'));
  return lines.join('\n');
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════

function render() {
  renderProgress();

  const main = document.getElementById('main');
  const wrap = document.createElement('div');
  wrap.className = 'step-in';

  switch (S.step) {
    case 1: wrap.innerHTML = step1(); break;
    case 2: wrap.innerHTML = step2(); break;
    case 3: wrap.innerHTML = step3(); break;
  }

  main.innerHTML = '';
  main.appendChild(wrap);
  main.querySelector('h1')?.focus({ preventScroll: true });
}

function renderProgress() {
  const el = document.getElementById('progress-bar');
  el.innerHTML = STEPS.map((s, i) => {
    const n   = i + 1;
    const cls = S.step > n ? 'is-done' : S.step === n ? 'is-active' : '';
    const dot = S.step > n ? I.check : String(n);
    return `
      ${i > 0 ? '<div class="prog-line"></div>' : ''}
      <div class="prog-step ${cls}">
        <div class="prog-dot">${dot}</div>
        <span class="prog-label">${t(s.label)}</span>
      </div>
    `;
  }).join('');
}

// ── Step 1: Create or edit, then the deliverable ──

// The inferred lens is stated as a discipline, not a job title: "Photography
// expertise applied automatically" reads better than "Photographer expertise".
const LENS_DISCIPLINE = {
  graphic: 'Graphic design', artist: 'Illustration',
  photographer: 'Photography', brand: 'Brand strategy', artdir: 'Art direction',
};

function lensLabel(role) {
  if (!role) return '';
  const discipline = t(LENS_DISCIPLINE[role.id] || role.name);
  return t('{lens} expertise applied automatically').replace('{lens}', discipline);
}

function step1() {
  const names = {banner: 'Social post or banner', logo: 'Logo concept', 'product-photo': 'Product photo'};
  const descriptions = {poster:'An event, announcement or print', banner:'A post, promotion or website image', illustration:'An idea brought to life in art', logo:'A first direction for your brand', 'product-photo':'Your product in a new setting', portrait:'A person, character or profile photo'};
  const popular = ['poster','banner','illustration','logo','product-photo','portrait'];
  const card = ct => `<button type="button" class="content-card" data-cid="${ct.id}" onclick="onSelectContent('${ct.id}')">
    <span class="cc-icon" aria-hidden="true">${I[ct.icon] || I.brand}</span>
    <span class="cc-label">${esc(t(names[ct.id] || ct.label))}</span>
    ${descriptions[ct.id] ? `<span class="cc-description">${t(descriptions[ct.id])}</span>` : ''}
    <span class="cc-arrow" aria-hidden="true">↗</span>
  </button>`;
  return `<div class="step-header intro-header">
    <div class="step-tag">${t('A little direction. A better image.')}</div>
    <h1 class="step-title" tabindex="-1">${S.lang === 'ja' ? '<span class="ja-phrase">アイデアから、</span><span class="ja-phrase">はじめよう。</span>' : t('Start with an idea.')}</h1>
    <p class="step-sub">${S.lang === 'ja' ? t(STEPS[0].sub) : 'Describe your idea. We’ll turn it into a ready-to-paste prompt for ChatGPT to create your image.'}</p>
  </div>
  <div class="mode-row">
    <button class="mode-card ${S.mode === 'create' ? 'is-active' : ''}" aria-pressed="${S.mode === 'create'}" onclick="setMode('create')"><span class="mode-card-title">${t('Create something new')}</span><span class="mode-card-sub">${t('Generate an image or design from scratch')}</span></button>
    <button class="mode-card ${S.mode === 'edit' ? 'is-active' : ''}" aria-pressed="${S.mode === 'edit'}" onclick="setMode('edit')"><span class="mode-card-title">${t('Edit an existing image')}</span><span class="mode-card-sub">${t('Change part of an image you already have')}</span></button>
  </div>
  ${S.mode === 'edit' ? `<div class="mode-continue"><button class="btn-primary" onclick="onSelectContent('imageedit')">${t('Continue')} ${ico('arrowR')}</button></div>` : `
    <h2 class="form-section-title">${t('Popular starting points')}</h2>
    <div class="content-grid popular-grid">${popular.map(id => card(CONTENT_TYPES.find(c => c.id === id))).join('')}</div>
    <details class="more-create"><summary>${t('More things to create')}</summary><div class="content-grid">${CONTENT_TYPES.filter(c => !c.hidden && !popular.includes(c.id)).map(card).join('')}</div></details>`}`;
}

function step2() {
  const roles   = getRoles();
  const role    = roles.find(r => r.id === S.role);
  const content = CONTENT_TYPES.find(c => c.id === S.content);
  if (!content) return '';

  const fields = renderFieldsWithSections(content);

  return `
    <div class="step-header">
      <div class="step-tag">${t('Step 2 of 3')}</div>
      <h1 class="step-title" tabindex="-1">${S.mode === 'edit' ? (S.lang === 'ja' ? '画像をどう変えますか？' : 'What would you like to change?') : (S.lang === 'ja' ? t(content.label) + 'をつくる' : 'Let’s make your ' + (content.id === 'banner' ? 'post or banner' : content.label.toLowerCase()))}</h1>
      <p class="step-sub">${S.lang === 'ja' ? '言葉で伝える、画像を見せる、またはその両方で。入力内容をChatGPT用のプロンプトにまとめます。' : 'Tell us in words, show us a reference, or use both. We’ll turn your direction into a prompt for ChatGPT.'}</p>
    </div>
    <div class="summary-bar">
      <div class="summary-item">${t(S.mode === 'edit' ? 'Editing' : 'Creating')}: <b>${esc(t(content.label))}</b></div>

    </div>
    <div class="form-stack">${fields}</div>
    <p id="form-error" class="form-error" role="alert" hidden></p>
    <div class="nav-row">
      <button class="btn-back" onclick="prevStep()">${ico('arrowL')} ${t('Back')}</button>
      <button class="btn-primary" onclick="onGenerate()">
        ${t('Build Brief')} ${ico('arrowR')}
      </button>
    </div>`;
}

// Group inputs by what the user is providing, not by whether they are optional.
function renderFieldsWithSections(content) {
  const fields = resolveFields(content).filter(f => f.type !== 'section' && !f.referenceField);
  const words = new Set(content.id === 'poster' ? ['copy'] : content.id === 'banner' ? ['textMode','headline','subheadline','ctaText','mustText'] : content.id === 'bookcover' ? ['title','author','subtitle'] : []);
  const refs = fields.filter(f => f.type === 'refpicker' && !f.showIf);
  const sizes = fields.filter(f => /^(size|sizes|sizeCustom|sizesCustom|aspect|format)$/.test(f.id) && !f.showIf || /^(sizeCustom|sizesCustom)$/.test(f.id));
  const idea = fields.filter(f => !words.has(f.id) && !refs.includes(f) && !sizes.includes(f) && (f.required === true || ['keep'].includes(f.id)));
  const written = fields.filter(f => words.has(f.id));
  const camera = PHOTO_TYPES.has(content.id) ? fields.filter(f => f.cameraCustomFor || CAMERA_FIELDS.some(c => c.id === f.id)) : [];
  const cameraPresets = PHOTO_TYPES.has(content.id) ? fields.filter(f => CAMERA_PRESET_IDS.has(f.id)) : [];
  const used = new Set([...refs,...sizes,...idea,...written,...camera,...cameraPresets]);
  const rest = fields.filter(f => !used.has(f) && !f.workflow && !['style','customStyle','visualDirection'].includes(f.id) && !(content.id === 'poster' && f.id === 'title'));
  const section = (title, hint, list) => list.length ? `<section class="brief-section"><div class="brief-section-heading"><h2>${t(title)}</h2>${hint ? `<p>${t(hint)}</p>` : ''}</div><div class="brief-section-fields">${list.map(renderField).join('')}</div></section>` : '';
  const inspiration = refs.filter(f => !f.assetMode);
  const assets = refs.filter(f => f.assetMode);
  return (content.id === 'imageedit' ? section('The image to edit','',assets) : '')
    + section(content.id === 'imageedit' ? 'Your changes' : 'Your idea', content.id === 'imageedit' ? '' : 'Describe what you want to see. These instructions will not appear as text in the image.', idea)
    + inspiration.map(renderField).join('')
    + (content.id === 'banner' ? assets.map(renderField).join('') : '')
    + section('Words in the image', ['poster','banner'].includes(content.id) ? (S.lang === 'ja' ? '必ず載せたい文言や事実を入力してください。意味を変えない装飾的な言葉は追加できます。文字が不要な場合は、そのように指定してください。' : 'Enter wording and facts that must appear. Decorative wording may be added without changing the meaning. Specify if you want no text.') : 'Type only the words you want people to read. Leave blank if you do not want any.', written)
    + (content.id !== 'imageedit' ? assets.filter(f => f.assetKind === 'product').map(renderField).join('') : '')
    + quickSizes(sizes)
    + quickStyles(fields)
    + `<details class="visual-options"><summary>${S.lang === 'ja' ? '構図と成功の条件' : 'Composition & success checks'} <small>${S.lang === 'ja' ? '任意・配置、目的、変えてはいけない条件' : 'Optional · purpose, placement and non-negotiables'}</small></summary><div class="brief-section-fields">${fields.filter(f => f.workflow).map(renderField).join('')}</div></details>`
    + brandControls()
    + (camera.length ? `<details class="visual-options"><summary>${S.lang === 'ja' ? 'カメラ・レンズの詳細' : 'Camera & lens details'} <small>${S.lang === 'ja' ? '任意・撮影用語で細かく指定' : 'Optional · use photographic terminology'}</small></summary><div class="brief-section-fields"><p class="field-hint">${S.lang === 'ja' ? 'レンズや露出、ライティングを自由に指定できます。数値は画像の見た目を伝えるための指定です。入力した値は対応する簡単な選択肢より優先されます。' : 'Specify optics, exposure and lighting in your own terms. These describe the intended photographic look. Entered values override matching quick choices.'}</p>${camera.map(renderField).join('')}${cameraPresets.length ? `<details class="all-sizes"><summary>${S.lang === 'ja' ? 'カメラの簡単な選択肢' : 'Camera quick choices'}</summary><div class="brief-section-fields">${cameraPresets.map(renderField).join('')}</div></details>` : ''}</div></details>` : '')
    + `<label class="consult-choice"><input type="checkbox" ${S.toggles.helpDecide ? 'checked' : ''} onchange="S.toggles.helpDecide=this.checked"><span><strong>${S.lang === 'ja' ? '相談してから作る' : 'Help me decide'}</strong><small>${S.lang === 'ja' ? '作成前にChatGPTが3つの質問をします。オフなら、そのまま作成します。' : 'Ask 3 questions in ChatGPT before creating. Leave off to create straight away.'}</small></span></label>`
    + (rest.length ? `<details class="customise"><summary><span>${t('More control over the look')}<small>${t('Optional: mood, style, colours and other details.')}</small></span><span class="disclosure-plus" aria-hidden="true">+</span></summary><div class="customise-body">${[...rest,...assets.filter(f => !['imageedit','banner'].includes(content.id) && f.assetKind !== 'product')].map(renderField).join('')}</div></details>` : '');
}

function selectQuick(field, value) {
  S.chips[field] = value ? [value] : [];
  document.querySelectorAll(`[data-field="${field}"]`).forEach(el => {
    const active = value ? el.dataset.val === value : !el.dataset.val;
    el.classList.toggle('is-selected', active);
    el.setAttribute('aria-pressed', String(active));
  });
  updateConditionals(field);
}

function quickStyles(fields) {
  const ja = S.lang === 'ja';
  const f = fields.find(f => f.id === 'style' && f.type.startsWith('chips'));
  const custom = fields.find(f => f.id === 'customStyle');
  const selected = (S.chips.visualDirection || [])[0];
  const choices = (CONTENT_DIRECTIONS[S.content] || []).map(k => {
    const d = VISUAL_DIRECTIONS[k];
    return `<button type="button" class="direction-option ${selected === d.name ? 'is-selected' : ''}" data-field="visualDirection" data-val="${esc(d.name)}" aria-pressed="${selected === d.name}" onclick="selectQuick('visualDirection',this.dataset.val)"><strong>${esc(ja ? d.nameJa : d.name)}</strong><span>${esc(ja ? d.descriptionJa : d.description)}</span></button>`;
  }).join('');
  return `<details class="visual-options"><summary>${ja ? 'スタイルを選ぶ' : 'Choose a style'} <small>${ja ? '任意・指定なしならおまかせ' : 'Optional · leave blank to let ChatGPT choose'}</small></summary><div class="brief-section-fields">
    ${f ? renderField(f) : ''}
    ${f && !(f.options || []).some(v => /let ai decide/i.test(v)) ? `<button type="button" class="chip" data-field="${f.id}" data-val="" aria-pressed="${!(S.chips[f.id] || []).length}" onclick="selectQuick('${f.id}','')">${t('Let AI decide')}</button>` : ''}
    ${custom ? renderField(custom) : ''}
    ${choices ? `<details class="all-sizes" ${selected ? 'open' : ''}><summary>${ja ? '構図の例' : 'Composition examples'}${selected ? ' · ' + esc(ja ? Object.values(VISUAL_DIRECTIONS).find(d => d.name === selected)?.nameJa || selected : selected) : ''}</summary><p class="field-hint">${ja ? '構図や仕上げの参考例です。おすすめの順位ではありません。自由入力の指定が優先されます。' : 'Optional starting points for layout and finish. These are examples, not recommended styles. Your own instructions take priority.'}</p><div class="direction-options">${choices}</div><button type="button" class="chip" data-field="visualDirection" data-val="" aria-pressed="${!selected}" onclick="selectQuick('visualDirection','')">${ja ? '構図例を使わない' : 'No composition example'}</button></details>` : ''}
  </div></details>`;
}

function filterStyleCatalog(query) {
  const term = query.trim().toLowerCase();
  let matches = 0;
  document.querySelectorAll('.style-catalog-option').forEach(button => {
    button.hidden = !button.dataset.search.includes(term);
    if (!button.hidden) matches++;
  });
  document.getElementById('style-no-results').hidden = matches > 0;
}

function quickSizes(fields) {
  const f = fields.find(f => f.type.startsWith('chips'));
  if (!f) return '';
  const options = f.options || f.groups?.flatMap(g => g.options) || [];
  const square = options.find(v => /square|1:1/i.test(v));
  const tall = options.find(v => /4:5|portrait|vertical|9:16/i.test(v));
  const wide = options.find(v => /16:9|landscape|wide/i.test(v));
  // Print-only lists retain their actual dimensions; do not invent a hidden shape value.
  const picks = [[square,'Square','正方形','square'],[tall,'Tall','縦長','tall'],[wide,'Wide','横長','wide'],[options.includes('Custom') ? 'Custom' : null,'Custom','カスタム','custom']].filter(x=>x[0]);
  const selected = S.chips[f.id] || [];
  const customField = fields.find(x => x.showIf?.field === f.id && x.showIf.value === 'Custom');
  // Custom already has a primary button; filter only the secondary display copy.
  const moreFields = fields.filter(x => x !== customField).map(x => x !== f || picks.length < 2 ? x : ({
    ...x,
    options: x.options?.filter(value => value !== 'Custom'),
    groups: x.groups?.map(group => ({...group, options: group.options.filter(value => value !== 'Custom')})).filter(group => group.options.length),
  }));
  return `<details class="visual-options"><summary>${S.lang === 'ja' ? 'サイズ・形を選ぶ' : 'Choose a size or shape'} <small>${S.lang === 'ja' ? '任意' : 'Optional'}</small></summary>${picks.length > 1 ? `<div class="shape-options">${picks.map(([v,en,ja,shape]) => `<button type="button" class="shape-option ${selected.includes(v) ? 'is-selected' : ''}" data-field="${f.id}" data-val="${esc(v)}" aria-pressed="${selected.includes(v)}" onclick="selectQuick('${f.id}',this.dataset.val)"><span class="shape-demo ${shape}" aria-hidden="true"></span><strong>${S.lang === 'ja' ? ja : en}</strong><small>${v === 'Custom' ? (S.lang === 'ja' ? 'サイズを入力' : 'Enter your dimensions') : t(v)}</small></button>`).join('')}</div>` : ''}${customField ? renderField(customField) : ''}<details class="all-sizes" ${picks.length < 2 ? 'open' : ''}><summary>${S.lang === 'ja' ? '印刷・その他のサイズ' : 'Print and more sizes'}</summary><div class="brief-section-fields">${moreFields.map(renderField).join('')}</div></details><button type="button" class="chip" data-field="${f.id}" data-val="" aria-pressed="${!selected.length}" onclick="selectQuick('${f.id}','')">${t('Let AI decide')}</button></details>`;
}

function fieldForDisplay(field) {
  const f = {...field};
  const ja = S.lang === 'ja';
  if (f.id === 'customStyle') { f.label = ja ? '自分の言葉でスタイルを指定' : 'Describe your own style'; f.placeholder = ja ? '例：質感のある紙に柔らかい鉛筆画' : 'e.g. soft pencil drawing on textured paper'; }
  if (/^(sizeCustom|sizesCustom)$/.test(f.id)) { f.required = true; f.label = ja ? 'カスタムサイズ' : 'Custom size'; f.hint = ja ? '幅と高さ、単位、または縦横比を入力してください。' : 'Enter width and height with units, or an aspect ratio.'; f.placeholder = ja ? '例：1200 × 1600 px、A3、2:3' : 'e.g. 1200 × 1600 px, A3, or 2:3'; }
  if (S.content === 'poster' && f.id === 'bigIdea') {
    f.label = ja ? 'どんなポスターにしたいですか？' : 'What should your poster look like?';
    f.hint = ja ? '何のポスターか、どんな絵や雰囲気にしたいかを書いてください。掲載する文字は次の欄に入力します。' : 'Tell us what it is for, what it should show, and how it should feel. Put the actual wording in “Words on your poster” below.';
    f.placeholder = ja ? '例：新しく開くパン屋の店頭に貼るポスター。クロワッサンのイラストと、暖かく親しみやすい色。' : 'A poster for a bakery opening, displayed in the shop window. Illustrated croissants, warm colours and a welcoming feel.';
  }
  if (S.content === 'poster' && f.id === 'copy') {
    f.label = ja ? 'ポスターに載せる文字' : 'Words on your poster';
    f.hint = ja ? '見出し、日時、場所などを、載せたいとおりに入力してください。デザインの説明は入れないでください。' : 'Include the headline, date, location and any other wording, exactly as you want them written.';
    f.placeholder = ja ? 'サンデーベーカリー\n9月12日 オープン\nパンをご購入の方にコーヒーをプレゼント' : 'Sunday Bakery\nGrand opening · 12 September\nFree coffee with every pastry';
  }
  if (f.type === 'refpicker' && !f.assetMode && !f.showIf) {
    f.label = ja ? '参考画像や作品に入れる画像' : 'A reference or image to include';
    f.hint = ja ? '写真やスクリーンショットを追加し、見た目の参考にするか、作品に入れるかを選んでください。' : 'Add a photo or screenshot, then choose: use its look, or include the image itself.';
  }
  if (S.content === 'banner' && f.type === 'refpicker') {
    if (!f.assetMode) {
      f.label = ja ? 'スタイルの参考画像' : 'Style reference images';
      f.hint = ja ? '好きな雰囲気、色、レイアウトがわかる画像。見た目の参考に使い、画像そのものは作品に入れません。' : 'Show a style, colour palette or layout you like. These guide the look; they are not placed in the design.';
    } else if (f.assetKind === 'logo') {
      f.label = ja ? '作品に入れるロゴ' : 'Logo to include';
      f.hint = ja ? '作品に掲載するロゴを追加してください。' : 'Add the actual logo that should appear in your post or banner.';
    } else {
      f.label = ja ? '作品に入れる画像' : 'Images to include';
      f.hint = ja ? '作品に掲載する商品写真、人物写真などを追加してください。参考画像とは別に扱います。' : 'Add product photos, people or other images that must appear in the finished post or banner.';
    }
  }
  if (f.type === 'textarea' && f.required === true && S.content !== 'imageedit') {
    f.sample = t(f.placeholder || '').replace(/^(Example: |e\.g\. )/, '');
    f.placeholder = ja ? 'ここに、作りたいイメージを書いてください…' : 'Describe your own idea here…';
  }
  return f;
}

function toggleAdvanced(btn, panelId) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  const open = !panel.hasAttribute('hidden');
  btn.setAttribute('aria-expanded', String(!open));
  if (open) { panel.setAttribute('hidden', ''); btn.classList.remove('is-open'); }
  else      { panel.removeAttribute('hidden'); btn.classList.add('is-open'); }
}

function renderField(f) {
  f = fieldForDisplay(f);
  if (f.type === 'section') return '';
  const val      = esc(S.form[f.id] || '');
  const toggleOn = S.toggles[f.id] || false;
  const selChips = S.chips[f.id] || [];
  const optBadge = f.required === false ? `<span class="opt-tag">${t('optional')}</span>` : '';
  const referenceAlternative = f.type === 'textarea' && f.required === true && !['imageedit','logo'].includes(S.content) && resolveFields(CONTENT_TYPES.find(c => c.id === S.content)).some(x => x.id === 'refs');
  const reqStar  = f.required === true && !referenceAlternative ? `<span class="req">*</span>` : '';

  let inner = '';

  if (f.type === 'text') {
    inner = `
      <div class="field">
        <label class="field-label" for="fi-${f.id}">${t(f.label)} ${reqStar}${optBadge}</label>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <input class="fi" id="fi-${f.id}" type="text" placeholder="${esc(t(f.placeholder) || '')}" value="${val}" oninput="S.form['${f.id}']=this.value">
      </div>`;
  }

  else if (f.type === 'textarea') {
    inner = `
      <div class="field">
        <label class="field-label" for="fi-${f.id}">${t(f.label)} ${reqStar}${optBadge}</label>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <textarea class="fi" id="fi-${f.id}" placeholder="${esc(t(f.placeholder) || '')}" oninput="S.form['${f.id}']=this.value">${val}</textarea>
        ${f.sample ? `<p class="description-example"><strong>${S.lang === 'ja' ? '記入例：' : 'Example description:'}</strong> ${esc(f.sample)}</p>` : ''}
      </div>`;
  }

  else if (f.type === 'select') {
    const opts = f.options.map(o =>
      `<option value="${esc(o)}" ${S.form[f.id] === o ? 'selected' : ''}>${t(o)}</option>`
    ).join('');
    inner = `
      <div class="field">
        <label class="field-label" for="fi-${f.id}">${t(f.label)} ${reqStar}${optBadge}</label>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <select class="fi" id="fi-${f.id}" onchange="S.form['${f.id}']=this.value; updateConditionals('${f.id}')">
          <option value="">${t(f.emptyLabel || '— Select —')}</option>
          ${opts}
        </select>
      </div>`;
  }

  else if (f.type === 'toggle') {
    inner = `
      <div class="field">
        <div class="field-label">${t(f.label)}</div>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <button type="button" class="toggle-row" role="switch" aria-label="${esc(t(f.label))}" aria-checked="${!!toggleOn}" onclick="onToggle('${f.id}')">
          <div class="toggle-track ${toggleOn ? 'is-on' : ''}" id="tt-${f.id}"></div>
          <span class="toggle-label-text" id="tl-${f.id}">${t(toggleOn ? 'Yes' : 'No')}</span>
        </button>
      </div>`;
  }

  else if (f.type === 'range') {
    const rVal = S.form[f.id] !== undefined && S.form[f.id] !== '' ? S.form[f.id] : (f.default !== undefined ? f.default : 50);
    const pct  = ((rVal - (f.min || 0)) / ((f.max || 100) - (f.min || 0))) * 100;
    inner = `
      <div class="field">
        <div class="field-label">${t(f.label)}</div>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <div class="range-wrap">
          <input class="range-input" type="range" aria-label="${esc(t(f.label))}"
            min="${f.min || 0}" max="${f.max || 100}" step="${f.step || 10}"
            value="${rVal}" aria-valuetext="${esc(getRangeLabel(rVal, f))}" style="--fill:${pct}%"
            oninput="onRange('${f.id}', this)">
          <div class="range-row">
            <span class="range-end">${t(f.minLabel || 'Loose')}</span>
            <span class="range-current" id="rl-${f.id}">${getRangeLabel(rVal, f)}</span>
            <span class="range-end">${t(f.maxLabel || 'Tight')}</span>
          </div>
        </div>
      </div>`;
  }

  else if (f.type === 'chips' || f.type === 'chips-one') {
    const single = f.type === 'chips-one';
    const badge  = single ? `<span class="opt-tag">${t('choose one')}</span>` : `<span class="opt-tag">${t('select all that apply')}</span>`;
    const maxN   = (!single && f.maxChips) ? f.maxChips : 0;
    const atMax  = maxN && selChips.length >= maxN;
    const chips  = f.options.map(o => {
      const isSel = selChips.includes(o);
      const sel = isSel ? 'is-selected' : '';
      const locked = atMax && !isSel ? 'is-locked' : '';
      return `<button type="button" aria-pressed="${isSel}" class="chip ${sel} ${locked}" data-field="${f.id}" data-val="${esc(o)}" data-single="${single}" data-max="${maxN || ''}" onclick="onChip(this)">${t(o)}</button>`;
    }).join('');
    inner = `
      <div class="field">
        <div class="field-label">${t(f.label)} ${badge}</div>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <div class="chips-wrap">${chips}</div>
      </div>`;
  }

  else if (f.type === 'chips-grouped' && f.styleRegistry === 'illustration') {
    const options = [...new Set(f.groups.flatMap(g => g.options))].sort((a,b) => a.localeCompare(b));
    inner = `<div class="field"><p class="field-hint">${S.lang === 'ja' ? 'スタイルを1つ選んでください。別のスタイルをクリックすると切り替わります。' : 'Choose one style. Click another style to replace it.'}</p>
      <label class="field-label" for="style-search">${S.lang === 'ja' ? 'スタイルを検索' : 'Find a style'}</label>
      <input class="fi" id="style-search" type="search" placeholder="${S.lang === 'ja' ? '名前や質感で検索…' : 'Search names or descriptions…'}" oninput="filterStyleCatalog(this.value)">
      <div class="style-catalog">${options.map(o => {
        const desc = ILLUSTRATION_STYLES[o]?.description || '';
        const selected = selChips.includes(o);
        return `<button type="button" class="direction-option style-catalog-option ${selected ? 'is-selected' : ''}" aria-pressed="${selected}" data-field="${f.id}" data-val="${esc(o)}" data-search="${esc([o,t(o),desc,t(desc)].join(' ').toLowerCase())}" onclick="selectQuick('${f.id}',this.dataset.val)"><strong>${esc(t(o))}</strong><span>${esc(t(desc))}</span></button>`;
      }).join('')}</div><p id="style-no-results" class="field-hint" role="status" hidden>${S.lang === 'ja' ? '一致するスタイルがありません。別の言葉で検索するか、下の欄で自由に指定してください。' : 'No matching styles. Try another word, or describe your own style below.'}</p></div>`;
  }

  else if (f.type === 'chips-grouped') {
    const infoBtn = f.styleRegistry ? (o) => `<button class="chip-info" type="button" title="${t('What is this style?')}" onclick="event.stopPropagation(); openStyleInfo('${f.styleRegistry}','${esc(o).replace(/'/g, "\\'")}')">${I.info}</button>` : () => '';
    const chipClass = f.styleRegistry ? 'chip chip-with-info' : 'chip';
    const renderGroup = g => {
      const chips = g.options.map(o => {
        const sel = selChips.includes(o) ? 'is-selected' : '';
        return `<span class="choice"><button type="button" class="chip ${sel}" aria-pressed="${!!sel}" data-field="${f.id}" data-val="${esc(o)}" data-single="false" data-max="${f.maxChips || 0}" onclick="onChip(this)">${t(o)}</button>${infoBtn(o)}</span>`;
      }).join('');
      return `
        <div class="chips-group">
          <div class="chips-group-label">${t(g.label)}</div>
          <div class="chips-wrap">${chips}</div>
        </div>`;
    };
    const visible = f.groups.filter(g => !g.collapsed);
    const collapsedGroups = f.groups.filter(g => g.collapsed);
    let primaryBlock;
    if (visible.length === 1) {
      // Single visible group → render as plain chips (no bordered container, no group label)
      const chips = visible[0].options.map(o => {
        const sel = selChips.includes(o) ? 'is-selected' : '';
        return `<span class="choice"><button type="button" class="chip ${sel}" aria-pressed="${!!sel}" data-field="${f.id}" data-val="${esc(o)}" data-single="false" data-max="${f.maxChips || 0}" onclick="onChip(this)">${t(o)}</button>${infoBtn(o)}</span>`;
      }).join('');
      primaryBlock = `<div class="chips-wrap">${chips}</div>`;
    } else {
      primaryBlock = `<div class="chips-grouped-wrap">${visible.map(renderGroup).join('')}</div>`;
    }
    let expander = '';
    if (collapsedGroups.length) {
      const hasSel = collapsedGroups.some(g => g.options.some(o => selChips.includes(o)));
      const moreLabel = t(f.expandLabel || 'More sizes');
      expander = `
        <button type="button" class="chips-more-toggle ${hasSel ? 'is-open' : ''}" aria-expanded="${hasSel}" onclick="toggleChipsMore(this)">
          <span class="chips-more-text">${moreLabel}</span><span class="chips-more-caret">▾</span>
        </button>
        <div class="chips-grouped-wrap chips-more-panel" ${hasSel ? '' : 'hidden'}>${collapsedGroups.map(renderGroup).join('')}</div>`;
    }
    inner = `
      <div class="field">
        <div class="field-label">${t(f.label)} <span class="opt-tag">${t('select all that apply')}</span></div>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        ${primaryBlock}
        ${expander}
      </div>`;
  }

  else if (f.type === 'refpicker') {
    const refs = S.refs[f.id] || [];
    // Assets that must be composited into the design have a fixed job already —
    // only inspiration references need a "use this for…" tag.
    const useSelect = (i, r) => f.assetMode ? '' : `
      <select class="ref-use" aria-label="${S.lang === 'ja' ? '画像の使い方' : 'How to use this image'}" onchange="onRefUse('${f.id}',${i},this.value)">
        <option value="General inspiration" ${!r.use || r.use === REF_USE_DEFAULT ? 'selected' : ''}>${S.lang === 'ja' ? 'この見た目を参考に' : 'Use this look'}</option>
${S.content === 'banner' ? '' : `        <option value="Include this image" ${r.use === 'Include this image' ? 'selected' : ''}>${S.lang === 'ja' ? 'この画像を作品に入れる' : 'Include this image'}</option>`}
        <optgroup label="${S.lang === 'ja' ? '一部だけ参考に' : 'Match one detail'}">${REF_USES.filter(u => u !== REF_USE_DEFAULT).map(u => `<option value="${esc(u)}" ${r.use === u ? 'selected' : ''}>${t(u)}</option>`).join('')}</optgroup>
      </select>`;
    const rows = refs.map((r, i) => {
      const notes = `<div class="reference-notes">${['borrow','ignore'].map(key => `<label class="field-hint" for="ref-${f.id}-${i}-${key}">${S.lang === 'ja' ? (key === 'borrow' ? '取り入れるもの' : '取り入れないもの') : (key === 'borrow' ? 'Borrow / preserve' : 'Ignore / exclude')}<input class="fi" id="ref-${f.id}-${i}-${key}" value="${esc(r[key] || '')}" placeholder="${S.lang === 'ja' ? '任意・具体的に指定' : 'Optional · name specific details'}" oninput="S.refs['${f.id}'][${i}]['${key}']=this.value"></label>`).join('')}</div>`;
      if (r.type === 'url') {
        return `
          <div class="ref-row">
            <span class="ref-icon">${I.link}</span>
            <input class="ref-input" aria-label="${t('Reference URL')}" type="url" value="${esc(r.value)}" placeholder="https://…"
                   oninput="onRefUrl('${f.id}',${i},this.value)">
            ${useSelect(i, r)}
            <button class="ref-remove" aria-label="${t('Remove image')}" onclick="removeRef('${f.id}',${i})">${I.trash}</button>
          </div>${notes}`;
      } else {
        return `
          <div class="ref-row">
            <img class="ref-thumb" src="${r.thumb}" alt="${esc(r.name)}">
            <span class="ref-filename">${esc(r.name)}</span>
            ${useSelect(i, r)}
            <button class="ref-remove" aria-label="${t('Remove image')}" onclick="removeRef('${f.id}',${i})">${I.trash}</button>
          </div>${notes}`;
      }
    }).join('');
    inner = `
      <div class="field" id="rffield-${f.id}">
        <div class="field-label">${t(f.label)} ${reqStar}${optBadge}</div>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        ${rows ? `<div class="ref-list">${rows}</div>` : ''}
        <div class="ref-add-row">
          <label class="ref-add-btn file-label upload-reference" style="cursor:pointer">
            ${I.image} ${S.lang === 'ja' ? (f.assetMode ? '画像をアップロード' : '参考画像をアップロード') : (f.assetMode ? 'Upload image' : 'Upload reference image')}
            <input type="file" accept="image/*" class="file-input" aria-label="${esc(t(f.label))}" onchange="onRefFile('${f.id}',this)">
          </label>
          <button class="ref-add-btn url-secondary" onclick="addRefUrl('${f.id}')">${I.link} ${S.lang === 'ja' ? 'リンクを追加' : 'Or add a link'}</button>
        </div>
        <p class="attachment-hint">${S.lang === 'ja' ? '最後に、同じ画像をChatGPTにも添付してください。プロンプトのコピーに画像は含まれません。' : 'You’ll attach the same image in ChatGPT too. Copying the prompt does not transfer the file.'}</p>
        ${!f.assetMode ? renderField(refStrengthField(f.id)) : ''}
      </div>`;
  }

  else if (f.type === 'colorpicker') {
    const colors = getColors(f.id);
    const rows = colors.map((c, i) => `
        <div class="cp-row">
          <div class="cp-swatch-wrap">
            <div class="cp-swatch" style="background:${c.hex}"></div>
            <input aria-label="${S.lang === 'ja' ? '色を選ぶ' : 'Choose colour'}" type="color" value="${c.hex}" oninput="onColorChange('${f.id}',${i},this.value)">
          </div>
          <span class="cp-hex">${c.hex}</span>
          <input class="cp-label" aria-label="${S.lang === 'ja' ? '色の名前' : 'Colour name'}" type="text" value="${esc(c.label)}" placeholder="Label" oninput="onColorLabel('${f.id}',${i},this.value)">
          <button class="cp-remove" onclick="removeColor('${f.id}',${i})" title="Remove">${I.trash}</button>
        </div>`
    ).join('');
    const canAdd = colors.length < 8;
    inner = `
      <div class="field" id="cpfield-${f.id}">
        <div class="field-label">${t(f.label)} ${optBadge}</div>
        ${colors.length === 0
          ? `<div class="cp-empty">${t('No colours defined — the AI will choose a palette that fits your brief.')}</div>`
          : `<div class="cp-grid">${rows}</div>`}
        ${canAdd ? `<button class="cp-add" onclick="addColor('${f.id}')">${I.plus} ${t('Add colour')}</button>` : ''}
      </div>`;
  }

  else if (f.type === 'colorstrategy') {
    const mode = S.form[f.id + '_mode'] || f.defaultColorMode || 'ai';
    const showBW = f.defaultColorMode === 'bw';
    inner = `
      <div class="field" id="csfield-${f.id}">
        <div class="field-label">${t(f.label)} ${optBadge}</div>
        ${f.hint ? `<div class="field-hint">${t(f.hint)}</div>` : ''}
        <div class="cs-tabs">
          ${showBW ? `<button class="cs-tab ${mode==='bw'?'is-active':''}" onclick="setColorMode('${f.id}','bw')">${t('Start in B&W')}</button>` : ''}
          <button class="cs-tab ${mode==='manual'?'is-active':''}" onclick="setColorMode('${f.id}','manual')">${t('Pick colours')}</button>
          <button class="cs-tab ${mode==='upload'?'is-active':''}" onclick="setColorMode('${f.id}','upload')">${t('Upload palette')}</button>
          <button class="cs-tab ${mode==='ai'    ?'is-active':''}" onclick="setColorMode('${f.id}','ai')">${t('Let AI decide')}</button>
        </div>
        ${buildCSContent(f.id, mode)}
      </div>`;
  }

  if (!inner) return '';

  // Universal showIf wrapper — works for all field types
  if (f.showIf) {
    const condMet = isCondMet(f.showIf);
    return `<div id="cond-${f.id}" style="${condMet ? '' : 'display:none'}">${inner}</div>`;
  }
  return inner;
}

// ── Step 3: The brief ─────────────────────────────

function getAttachableImages() {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return [];
  const images = [];
  resolveFields(ct).forEach(f => {
    if (f.showIf && !isCondMet(f.showIf)) return;
    if (f.type === 'refpicker') {
      (S.refs[f.id] || []).filter(r => r.type === 'file' && r.thumb).forEach(r => {
        images.push({ label: f.label, name: r.name, thumb: r.thumb });
      });
    }
    if (f.type === 'colorstrategy' && (S.form[f.id + '_mode'] || 'ai') === 'upload') {
      const pal = S.refs[f.id + '_palette'];
      if (pal) images.push({ label: 'Colour Palette Reference', name: pal.name, thumb: pal.thumb, isPalette: true });
    }
  });
  return images;
}

// The decisions the user actually made, in plain language — this is what the
// final screen leads with, rather than the raw brief text.
function buildDecisions() {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return [];
  const out = [];
  if (selectedBrand()) out.push({label:S.lang === 'ja' ? 'ブランド' : 'Brand', value:selectedBrand().name});

  resolveFields(ct).forEach(f => {
    if (f.type === 'section' || f.cameraCustomFor || /^(sizeCustom|sizesCustom)$/.test(f.id)) return;
    if (f.showIf && !isCondMet(f.showIf)) return;
    if (isSuperseded(f)) return;
    const label = f.promptLabel || f.label;

    if (f.type === 'refpicker') {
      const refs = (S.refs[f.id] || []).filter(r => r.type === 'url' ? r.value.trim() : r.name);
      if (!refs.length) return;
      const value = f.assetMode
        ? refs.map(r => r.type === 'url' ? r.value.trim() : r.name).join(', ')
        : refs.map((r, i) => `${r.name || r.value || t('Image') + ' ' + (i + 1)} → ${r.use === 'Include this image' ? (S.lang === 'ja' ? '作品に入れる' : 'include in the image') : t(r.use || REF_USE_DEFAULT).toLowerCase()}`).join(' · ');
      out.push({ label, value });
    } else if (f.type === 'colorstrategy') {
      const mode = S.form[f.id + '_mode'] || f.defaultColorMode || 'ai';
      const colors = S.colors[f.id] || [];
      if (mode === 'ai') return;
      const value = mode === 'manual' ? (colors.map(c => c.hex).join(', ') || t('None picked yet'))
                  : mode === 'upload' ? t('Matched to an uploaded palette image')
                  : t('Start in black and white');
      out.push({ label, value });
    } else if (f.type === 'toggle') {
      if (S.toggles[f.id]) out.push({ label, value: t('Yes') });
    } else if (f.type === 'chips' || f.type === 'chips-one' || f.type === 'chips-grouped') {
      const sel = S.chips[f.id] || [];
      if (!sel.length) return;
      if (sel.length === 1 && /let ai decide|not sure/i.test(sel[0])) return;
      const custom = resolveFields(ct).find(x => x.showIf?.field === f.id && x.showIf.value === 'Custom');
      out.push({ label, value: sel.map(v => v === 'Custom' && custom ? S.form[custom.id] || t(v) : t(v)).join(S.lang === 'ja' ? '、' : ', ') });
    } else if (f.type === 'range') {
      if (f.referenceField || S.form[f.id] !== undefined) out.push({label: f.referenceField ? label + ' (' + t(resolveFields(ct).find(x => x.id === f.referenceField)?.label || f.referenceField) + ')' : label, value: String(getRangeLabel(S.form[f.id] === undefined || S.form[f.id] === '' ? f.default : S.form[f.id], f))});
    } else {
      const val = CAMERA_OPTIONS[f.id] ? cameraValue(f.id) : (S.form[f.id] || '').trim();
      if (val) out.push({ label, value: val });
    }
  });

  return out;
}

function buildRepairPrompt() {
  const ja = S.lang === 'ja';
  const change = (S.form.repairChange || '').trim();
  if (!change) return '';
  const preserve = (S.form.repairPreserve || '').trim();
  const allow = (S.form.repairAllow || '').trim();
  return [ja ? '添付した最も良い採用済み画像を編集してください。' : 'Edit the attached best accepted image.',
    (ja ? '変更：' : 'Change: ') + change,
    (ja ? '維持：' : 'Preserve: ') + (preserve || (ja ? '変更に関係のない内容、文字、構図、見た目。' : 'All unrelated content, wording, composition and appearance.')),
    (ja ? '調整可：' : 'Allow: ') + (allow || (ja ? '変更に必要な影、反射、接触部分だけ。' : 'Only shadows, reflections and contact that must adjust to the change.')),
    (S.form.imageChecks || '').trim() ? (ja ? '再確認：' : 'Recheck: ') + S.form.imageChecks.trim() : '',
    ja ? '完成画像を返してください。変更箇所と保護した部分を確認し、確認できない点は明記してください。' : 'Return the edited image. Check the requested fix and protected areas; state anything you cannot verify.'
  ].filter(Boolean).join('\n\n');
}
function refreshRepairPrompt() {
  document.getElementById('repair-output').value = buildRepairPrompt();
}
function renderResultReview() {
  const ja = S.lang === 'ja';
  const checks = (S.form.imageChecks || '').split(/\n|;/).map(v => v.trim()).filter(Boolean);
  const prompts = [
    ['repairChange','What failed, and what should change?','失敗した点と修正内容'],
    ['repairPreserve','What already works and must stay?','維持したい部分'],
    ['repairAllow','What may adjust?','調整してよい部分']
  ];
  return `<details class="visual-options result-review"><summary>${ja ? '結果を確認して修正する' : 'Review & repair your result'}<small>${ja ? '生成後に使う' : 'Use after generating'}</small></summary><div class="brief-section-fields">
    <p class="field-hint">${ja ? '文字、個数、位置関係、本人・商品の特徴、サイズを実際の画像で確認してください。見た目の好みとは別に判断します。' : 'Inspect the actual image: wording, object counts, relationships, identity and dimensions. Judge these separately from whether you like the style.'}</p>
    ${checks.length ? `<ul class="result-checks">${checks.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    <p class="field-hint">${ja ? '最も良い採用済み画像を添付し、小さく確認しやすい修正を行います。失敗が続く場合はスケッチ、範囲指定、専用の編集ツールを使ってください。' : 'Attach your best accepted image and make a small, checkable repair. If the same fix keeps failing, try a sketch, a region selection or a dedicated editing tool.'}</p>
    ${prompts.map(([id,en,jp]) => `<div><label class="field-label" for="${id}">${ja ? jp : en}</label><textarea class="fi" id="${id}" rows="2" oninput="S.form['${id}']=this.value;refreshRepairPrompt()">${esc(S.form[id] || '')}</textarea></div>`).join('')}
    <div><label class="field-label" for="repair-output">${ja ? '修正プロンプト（選択してコピー）' : 'Repair prompt · select and copy'}</label><textarea class="fi" id="repair-output" rows="8" readonly placeholder="${ja ? '修正内容を入力すると表示されます。' : 'Describe the change above to build your repair prompt.'}">${esc(buildRepairPrompt())}</textarea></div>
  </div></details>`;
}

      <p class="use-note">${S.toggles.helpDecide ? (S.lang === 'ja' ? 'ChatGPTに3つ質問してから作るよう伝えます。「おまかせ」と答えても大丈夫です。' : 'ChatGPT will be asked to start with 3 useful questions. You can answer “Choose for me”.') : (S.lang === 'ja' ? 'ChatGPTにこの内容で画像を作るよう伝えます。未指定の点はおまかせです。' : 'Your prompt asks ChatGPT to create straight away and choose any unspecified details.')}</p>

function openTaskInfo(contentId) {
  const ct = CONTENT_TYPES.find(c => c.id === contentId);
  if (!ct) return;
  const roles = getRoles();
  const role  = roles.find(r => r.id === (S.role || CONTENT_ROLE[contentId]));

  const subSection = (label, body) => `
    <div class="info-sub">
      <h4>${esc(label)}</h4>
      ${body}
    </div>`;
  const para = (text) => `<p>${esc(t(text))}${/[.!?]$/.test(text) ? '' : '.'}</p>`;
  const list = (items) => `<ul>${items.map(i => `<li>${esc(t(i))}</li>`).join('')}</ul>`;

  const groups = [];

  // Slim override: single block, no role+task split
  if (ct.slimPrompt) {
    groups.push(`
      <div class="info-group">
        <h3>${t('What the AI is told')}</h3>
        <div class="info-slim">${esc(t(ct.slimPrompt))}</div>
      </div>`);
    document.getElementById('modal-root').innerHTML = `
      <div class="modal-backdrop" onclick="closeModal(event)">
        <div class="modal modal-wide" onclick="event.stopPropagation()">
          <button class="modal-close" aria-label="${t('Close')}" onclick="closeModal()">${I.close}</button>
          <h2 class="modal-title">${esc(t(ct.label))} — ${t('what the AI is told')}</h2>
          <p class="info-meta">${t('This deliverable uses a self-contained expert brief rather than layering on generic role keywords.')}</p>
          <div class="modal-body">${groups.join('')}</div>
          <div class="modal-actions">
            <button class="btn-primary" onclick="closeModal()">${t('Close')}</button>
          </div>
        </div>
      </div>`;
    return;
  }

  // ── Group 1: Role ───────────────────────────────
  if (role) {
    const roleParts = [];
    roleParts.push(`<p class="info-lede"><b>${esc(t(role.name))}</b>${role.desc ? ` — ${esc(t(role.desc))}` : ''}</p>`);
    if (role.keywords)                              roleParts.push(subSection(t('Core expertise'), para(role.keywords)));
    if (role.optimizeFor && role.optimizeFor.length) roleParts.push(subSection(t('Optimize for'), list(role.optimizeFor)));
    if (role.guidance && role.guidance.length)       roleParts.push(subSection(t('When responding'), list(role.guidance)));
    groups.push(`
      <div class="info-group">
        <h3>${t('Expert lens')}</h3>
        ${roleParts.join('')}
      </div>`);
  }

  // ── Group 2: Skillset for this task ─────────────
  const hasTaskContent = ct.taskExpertise || (ct.optimizeFor || []).length || (ct.guidance || []).length;
  if (hasTaskContent) {
    const taskParts = [];
    if (ct.taskExpertise)                           taskParts.push(subSection(t('Skills'), para(ct.taskExpertise)));
    if (ct.optimizeFor && ct.optimizeFor.length)    taskParts.push(subSection(t('Optimize for'), list(ct.optimizeFor)));
    if (ct.guidance && ct.guidance.length)          taskParts.push(subSection(t('When responding'), list(ct.guidance)));
    groups.push(`
      <div class="info-group">
        <h3>${t('Expertise applied')}</h3>
        ${taskParts.join('')}
      </div>`);
  } else {
    groups.push(`
      <div class="info-group">
        <h3>${t('Expertise applied')}</h3>
        <p class="info-empty">${t('No deliverable-specific expertise defined yet — only the expert lens above is applied.')}</p>
      </div>`);
  }

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal modal-wide" onclick="event.stopPropagation()">
        <button class="modal-close" aria-label="${t('Close')}" onclick="closeModal()">${I.close}</button>
        <h2 class="modal-title">${esc(t(ct.label))} — ${t('what the AI is told')}</h2>
        <p class="info-meta">${t('Choosing this deliverable applies the expertise below. Only a short summary of it reaches the brief.')}</p>
        <div class="modal-body">${groups.join('')}</div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="closeModal()">${t('Close')}</button>
        </div>
      </div>
    </div>`;
}

function setMode(mode) {
  if (S.mode === mode) return;
  S.mode = mode;
  S.content = null;
  render();
}

function onSelectRole(id) {
  S.role = id;
  closeModal();
  render();
}

function onSelectContent(id) {
  if (S.content !== id) {
    S.content = id;
    S.form = {};
    S.chips = {};
    S.toggles = { helpDecide: true };
    S.colors = {};
    S.refs = {};
    seedChipDefaults();
  }
  S.role = CONTENT_ROLE[id] || 'graphic';
  if (id === 'imageedit') { nextStep(); return; }
  confirmCardAndAdvance(`.content-card[data-cid="${id}"]`);
}

function seedChipDefaults() {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return;
  resolveFields(ct).forEach(f => {
    if (!(f.type === 'chips-one' || f.type === 'chips') || !Array.isArray(f.options)) return;
    if (S.chips[f.id] && S.chips[f.id].length) return;
    if (f.id === 'logoRules') return;
    if (Array.isArray(f.defaultChips) && f.defaultChips.length) {
      S.chips[f.id] = [...f.defaultChips];
      return;
    }
    const aiOption = f.options.find(o => /let ai decide/i.test(o));
    if (aiOption) {
      S.chips[f.id] = [aiOption];
    }
  });
}

function confirmCardAndAdvance() { nextStep(); }

function onToggle(id) {
  S.toggles[id] = !S.toggles[id];
  const track = document.getElementById(`tt-${id}`);
  const label = document.getElementById(`tl-${id}`);
  if (track) { track.classList.toggle('is-on'); track.parentElement.setAttribute('aria-checked', String(S.toggles[id])); }
  if (label) label.textContent = t(S.toggles[id] ? 'Yes' : 'No');
  updateConditionals(id);
}

function getRangeLabel(val, f) {
  if (!f.rangeLabels) return String(val);
  const keys = Object.keys(f.rangeLabels).map(Number).sort((a, b) => a - b);
  let label = f.rangeLabels[keys[0]];
  for (const k of keys) { if (val >= k) label = f.rangeLabels[k]; }
  return t(label);
}

function onRange(id, input) {
  const val = parseInt(input.value);
  S.form[id] = val;
  const pct = ((val - parseInt(input.min || 0)) / (parseInt(input.max || 100) - parseInt(input.min || 0))) * 100;
  input.style.setProperty('--fill', pct + '%');
  const content = CONTENT_TYPES.find(c => c.id === S.content);
  const f = content && resolveFields(content).find(f => f.id === id);
  const labelEl = document.getElementById('rl-' + id);
  if (labelEl && f) labelEl.textContent = getRangeLabel(val, f);
  if (f) input.setAttribute('aria-valuetext', getRangeLabel(val, f));
}

function onChip(el) {
  const { field, val, single, max } = el.dataset;
  const isSingle = single === 'true';
  const maxN = max ? parseInt(max, 10) : 0;
  if (!S.chips[field]) S.chips[field] = [];

  if (isSingle) {
    S.chips[field] = S.chips[field].includes(val) ? [] : [val];
  } else {
    const idx = S.chips[field].indexOf(val);
    if (idx > -1) {
      S.chips[field].splice(idx, 1);
    } else {
      if (maxN && S.chips[field].length >= maxN) return; // at selection limit
      S.chips[field].push(val);
    }
  }

  const atMax = maxN && S.chips[field].length >= maxN;
  document.querySelectorAll(`[data-field="${field}"]`).forEach(c => {
    const isSel = S.chips[field].includes(c.dataset.val);
    c.classList.toggle('is-selected', isSel);
    c.setAttribute('aria-pressed', String(isSel));
    if (maxN) c.classList.toggle('is-locked', atMax && !isSel);
  });

  updateConditionals(field);
}

function toggleChipsMore(btn) {
  const panel = btn.nextElementSibling;
  if (!panel) return;
  const open = panel.hasAttribute('hidden');
  panel.toggleAttribute('hidden', !open);
  btn.classList.toggle('is-open', open);
  btn.setAttribute('aria-expanded', String(open));
}

function nextStep() {
  if (S.step < 3) { S.step++; render(); scrollTo({ top: 0, behavior: 'smooth' }); }
}

function prevStep() {
  if (S.step > 1) { S.step--; render(); scrollTo({ top: 0, behavior: 'smooth' }); }
}

function onGenerate() {
  // Flush any textarea/input values that might not have fired oninput
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (ct) {
    resolveFields(ct).forEach(f => {
      if (['text','textarea','select'].includes(f.type)) {
        const el = document.getElementById(`fi-${f.id}`);
        if (el) S.form[f.id] = el.value;
      }
    });
  }
  document.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  const missing = resolveFields(ct).find(f => {
    if (f.showIf && !isCondMet(f.showIf)) return false;
    const customSize = f.showIf?.value === 'Custom' && /size/i.test(f.id);
    if (f.required !== true && !customSize) return false;
    if (f.type === 'refpicker') return !(S.refs[f.id] || []).some(r => r.type === 'file' ? !!r.thumb : /^https?:\/\//i.test(r.value.trim()));
    if (f.type === 'textarea' && ct.id !== 'imageedit' && ct.id !== 'logo' && (S.refs.refs || []).some(r => r.type === 'file' ? !!r.thumb : /^https?:\/\//i.test(r.value.trim()))) return false;
    return ['text','textarea','select'].includes(f.type) && !(S.form[f.id] || '').trim();
  });
  if (missing) {
    const error = document.getElementById('form-error');
    error.textContent = missing.type === 'refpicker' ? t('Please attach the image you want to edit.') : t('Please add:') + ' ' + t(fieldForDisplay(missing).label);
    if (missing.type === 'textarea' && !['imageedit','logo'].includes(ct.id) && resolveFields(ct).some(f => f.id === 'refs')) error.textContent = S.lang === 'ja' ? '作りたいイメージをひと言で説明するか、参考画像を追加してください。' : 'Describe your idea in a sentence, or upload a reference image to show the look you want.';
    error.hidden = false;
    const input = document.getElementById('fi-' + missing.id) || document.querySelector('#rffield-' + missing.id + ' input');
    if (input) { for (let ancestor = input.parentElement; ancestor; ancestor = ancestor.parentElement) { if (ancestor.tagName === 'DETAILS') ancestor.open = true; } input.closest('.field')?.appendChild(error); input.setAttribute('aria-invalid', 'true'); input.setAttribute('aria-describedby', 'form-error'); input.focus(); }
    return;
  }
  nextStep();
}

async function onCopy() {
  const status = document.getElementById('copy-status');
  let copied = false;
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(buildPrompt()); copied = true; }
  } catch {}
  if (!copied) {
    const ta = document.createElement('textarea');
    ta.value = buildPrompt();
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    try { copied = document.execCommand('copy'); } catch {}
    ta.remove();
    document.getElementById('copy-btn')?.focus();
  }
  if (status) status.textContent = t(copied ? 'Copied — now paste it into ChatGPT.' : 'Could not copy automatically. Open the full prompt below and copy the text.');
  document.getElementById('copy-btn')?.classList.toggle('is-copied', copied);
  if (!copied) {
    document.getElementById('full-brief')?.removeAttribute('hidden');
    document.querySelector('[aria-controls="full-brief"]')?.setAttribute('aria-expanded','true');
  }
}

function onStartOver() {
  // Language is a preference, not part of the brief — it survives Start Over.
  S = { step: 1, lang: S.lang, mode: 'create', role: null, content: null, form: {}, toggles: { helpDecide: true }, chips: {}, colors: {}, refs: {} };
  render();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function onEditRole(e, id) {
  e.stopPropagation();
  const role = getRoles().find(r => r.id === id);
  if (role) openRoleModal(role);
}

function onDeleteRole(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this custom role?')) return;
  const roles = getRoles().filter(r => r.id !== id);
  setRoles(roles);
  if (S.role === id) S.role = null;
  render();
}

function onSaveRole(existingId) {
  const name = document.getElementById('m-name')?.value.trim();
  const desc = document.getElementById('m-desc')?.value.trim();
  if (!name || !desc) { alert('Please fill in both fields.'); return; }

  const roles = getRoles();
  if (existingId) {
    const r = roles.find(r => r.id === existingId);
    if (r) { r.name = name; r.desc = desc; }
  } else {
    roles.push({ id: 'c_' + Date.now(), name, desc, icon: 'brand', custom: true });
  }
  setRoles(roles);
  closeModal();
  render();
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  const modal = document.querySelector('#modal-root [role="dialog"]');
  if (modal && e.key === 'Tab') {
    const items = [...modal.querySelectorAll('button, a, input, select, textarea, [tabindex="0"]')];
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════════════
//  CONDITIONALS
// ═══════════════════════════════════════════════════

function redrawRefField(fieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  const f  = ct && resolveFields(ct).find(fi => fi.id === fieldId);
  const el = document.getElementById(`rffield-${fieldId}`);
  if (f && el) el.outerHTML = renderField(f);
  updateConditionals(fieldId);
}

function addRefUrl(fieldId) {
  if (!S.refs[fieldId]) S.refs[fieldId] = [];
  S.refs[fieldId].push({ type: 'url', value: '', use: REF_USE_DEFAULT });
  redrawRefField(fieldId);
  // Focus the new input
  setTimeout(() => {
    const rows = document.querySelectorAll(`#rffield-${fieldId} .ref-input`);
    if (rows.length) rows[rows.length - 1].focus();
  }, 0);
}

function onRefUrl(fieldId, idx, value) {
  if (S.refs[fieldId]) S.refs[fieldId][idx].value = value;
  updateConditionals(fieldId);
}

function onRefUse(fieldId, idx, value) {
  if (S.refs[fieldId] && S.refs[fieldId][idx]) S.refs[fieldId][idx].use = value;
  updateConditionals(fieldId);
}

function onRefFile(fieldId, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (!S.refs[fieldId]) S.refs[fieldId] = [];
    S.refs[fieldId].push({ type: 'file', name: file.name, thumb: e.target.result, use: REF_USE_DEFAULT });
    redrawRefField(fieldId);
  };
  reader.readAsDataURL(file);
}

function removeRef(fieldId, idx) {
  if (S.refs[fieldId]) S.refs[fieldId].splice(idx, 1);
  redrawRefField(fieldId);
}

function getColors(fieldId) {
  if (!S.colors[fieldId]) S.colors[fieldId] = [];
  return S.colors[fieldId];
}

// ── Color strategy helpers ────────────────────────

function buildCSContent(fieldId, mode) {
  if (mode === 'manual') {
    const colors = getColors(fieldId);
    const rows = colors.map((c, i) => `
      <div class="cp-row">
        <div class="cp-swatch-wrap">
          <div class="cp-swatch" style="background:${c.hex}"></div>
          <input aria-label="${S.lang === 'ja' ? '色を選ぶ' : 'Choose colour'}" type="color" value="${c.hex}" oninput="onColorChange('${fieldId}',${i},this.value)">
        </div>
        <span class="cp-hex">${c.hex}</span>
        <input class="cp-label" aria-label="${S.lang === 'ja' ? '色の名前' : 'Colour name'}" type="text" value="${esc(c.label)}" placeholder="Label" oninput="onColorLabel('${fieldId}',${i},this.value)">
        <button class="cp-remove" onclick="removeColorCS('${fieldId}',${i})" title="Remove">${I.trash}</button>
      </div>`).join('');
    const canAdd = colors.length < 8;
    return `
      ${colors.length === 0 ? `<div class="cp-empty">${t('No colours added yet.')}</div>` : `<div class="cp-grid">${rows}</div>`}
      ${canAdd ? `<button class="cp-add" onclick="addColorCS('${fieldId}')">${I.plus} ${t('Add colour')}</button>` : ''}`;
  }
  if (mode === 'upload') {
    const pal = S.refs[fieldId + '_palette'];
    if (pal) {
      return `
        <div class="cs-palette-preview">
          <img class="cs-palette-thumb" src="${pal.thumb}" alt="${esc(pal.name)}">
          <div>
            <div class="cs-palette-name">${esc(pal.name)}</div>
            <button class="cp-remove" style="display:inline-flex;gap:5px;padding:4px 8px;border-radius:6px" onclick="removePaletteImage('${fieldId}')">${I.trash} ${S.lang === 'ja' ? '削除' : 'Remove'}</button>
          </div>
        </div>`;
    }
    return `
      <label class="cs-upload-btn file-label">
        <input type="file" accept="image/*" class="file-input" aria-label="${t('Upload palette image')}" onchange="uploadPaletteImage('${fieldId}',this)">
        ${I.plus} ${t('Upload palette image')}
      </label>
      <div class="field-hint" style="margin-top:6px">${t('Upload a mood board, brand guide, or any image — the AI will base the colour palette on it.')}</div>`;
  }
  if (mode === 'bw') {
    return `<div class="cs-ai-note">${t('Start in black and white. Colour can be added once the silhouette and form are working.')}</div>`;
  }
  // ai
  return `<div class="cs-ai-note">${t('The AI will choose a colour palette that best fits your brief and tone.')}</div>`;
}

function setColorMode(fieldId, mode) {
  S.form[fieldId + '_mode'] = mode;
  redrawColorStrategy(fieldId);
}

function redrawColorStrategy(fieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  const f  = ct && resolveFields(ct).find(fi => fi.id === fieldId);
  const el = document.getElementById(`csfield-${fieldId}`);
  if (f && el) el.outerHTML = renderField(f);
}

function addColorCS(fieldId) {
  const colors = getColors(fieldId);
  if (colors.length >= 8) return;
  colors.push({ label: COLOR_LABELS[colors.length] || 'Extra', hex: '#888888' });
  redrawColorStrategy(fieldId);
}

function removeColorCS(fieldId, idx) {
  getColors(fieldId).splice(idx, 1);
  redrawColorStrategy(fieldId);
}

function uploadPaletteImage(fieldId, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    S.refs[fieldId + '_palette'] = { name: file.name, thumb: e.target.result };
    redrawColorStrategy(fieldId);
  };
  reader.readAsDataURL(file);
}

function removePaletteImage(fieldId) {
  delete S.refs[fieldId + '_palette'];
  redrawColorStrategy(fieldId);
}

// ─────────────────────────────────────────────────

function onColorChange(fieldId, idx, hex) {
  getColors(fieldId)[idx].hex = hex;
  const wrapper = document.getElementById(`cpfield-${fieldId}`) || document.getElementById(`csfield-${fieldId}`);
  const row = wrapper?.querySelectorAll('.cp-row')[idx];
  if (row) {
    row.querySelector('.cp-swatch').style.background = hex;
    row.querySelector('.cp-hex').textContent = hex;
  }
}

function onColorLabel(fieldId, idx, label) {
  getColors(fieldId)[idx].label = label;
}

function redrawColorField(fieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  const f  = ct && resolveFields(ct).find(fi => fi.id === fieldId);
  const el = document.getElementById(`cpfield-${fieldId}`);
  if (f && el) el.outerHTML = renderField(f);
}

const COLOR_LABELS = ['Primary', 'Secondary', 'Accent', 'Highlight', 'Dark', 'Light', 'Neutral', 'Extra'];

function addColor(fieldId) {
  const colors = getColors(fieldId);
  if (colors.length >= 8) return;
  const label = COLOR_LABELS[colors.length] || 'Extra';
  colors.push({ label, hex: '#888888' });
  redrawColorField(fieldId);
}

function removeColor(fieldId, idx) {
  const colors = getColors(fieldId);
  colors.splice(idx, 1);
  redrawColorField(fieldId);
}

function isCondMet(showIf) {
  if (showIf.src === 'referenceGuidance') {
    const ct = CONTENT_TYPES.find(c => c.id === S.content);
    const ref = ct && resolveFields(ct).find(f => f.id === showIf.field);
    if (ref?.showIf && !isCondMet(ref.showIf)) return false;
    return (S.refs[showIf.field] || []).some(r => r.use !== 'Include this image' && (r.type === 'url' ? /^https?:\/\//i.test((r.value || '').trim()) : !!r.thumb));
  }
  if (showIf.src === 'refs') {
    return (S.refs[showIf.field] || []).length > 0;
  }
  if (showIf.src === 'chips') {
    return (S.chips[showIf.field] || []).includes(showIf.value);
  }
  if (showIf.src === 'toggle') {
    return !!S.toggles[showIf.field] === showIf.value;
  }
  return S.form[showIf.field] === showIf.value;
}

function updateConditionals(changedFieldId) {
  const ct = CONTENT_TYPES.find(c => c.id === S.content);
  if (!ct) return;
  resolveFields(ct).forEach(f => {
    if (!f.showIf || f.showIf.field !== changedFieldId) return;
    const wrapper = document.getElementById(`cond-${f.id}`);
    if (!wrapper) return;
    const show = isCondMet(f.showIf);
    wrapper.style.display = show ? '' : 'none';
    if (!show && f.referenceField) return;
    if (!show) {
      S.form[f.id]   = '';
      S.chips[f.id]  = [];
      S.refs[f.id]   = [];
      const el = document.getElementById(`fi-${f.id}`);
      if (el) el.value = '';
    }
  });
}

// ═══════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════

S.lang = getLang();
document.documentElement.lang = S.lang;
renderLangSwitch();
render();
</script>
